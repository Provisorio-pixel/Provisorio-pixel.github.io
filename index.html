        <div class="row-between" style="border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;margin-bottom:7px">
          <div class="row">
            <input type="color" value="${pr.cor}" data-cor="${i}" style="width:44px;padding:3px">
            <input value="${escHtml(pr.nome)}" data-nome="${i}" style="max-width:220px">
          </div>
          <div class="row">
            <button class="btn-sm" data-sube="${i}" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button class="btn-sm" data-desce="${i}" ${i === S.cfg.prioridades.length - 1 ? 'disabled' : ''}>↓</button>
            <button class="btn-sm btn-bad" data-rem="${i}">Remover</button>
          </div>
        </div>`).join('');
      const salvar = async () => { await Backend.salvarConfig({ prioridades: S.cfg.prioridades }); };
      porId('listaPrio').querySelectorAll('[data-nome]').forEach(n => n.onchange = async e => {
        S.cfg.prioridades[Number(e.target.dataset.nome)].nome = e.target.value; await salvar();
      });
      porId('listaPrio').querySelectorAll('[data-cor]').forEach(n => n.onchange = async e => {
        S.cfg.prioridades[Number(e.target.dataset.cor)].cor = e.target.value; await salvar(); desenharPrio();
      });
      porId('listaPrio').querySelectorAll('[data-sube]').forEach(n => n.onclick = async e => {
        const i = Number(e.currentTarget.dataset.sube); const a = S.cfg.prioridades;
        [a[i - 1], a[i]] = [a[i], a[i - 1]]; await salvar(); desenharPrio();
      });
      porId('listaPrio').querySelectorAll('[data-desce]').forEach(n => n.onclick = async e => {
        const i = Number(e.currentTarget.dataset.desce); const a = S.cfg.prioridades;
        [a[i + 1], a[i]] = [a[i], a[i + 1]]; await salvar(); desenharPrio();
      });
      porId('listaPrio').querySelectorAll('[data-rem]').forEach(n => n.onclick = async e => {
        const i = Number(e.currentTarget.dataset.rem);
        if (!confirm('Remover este grupo de prioridade?')) return;
        S.cfg.prioridades.splice(i, 1); await salvar(); desenharPrio();
      });
    };
    desenharPrio();

    porId('cWa').addEventListener('input', e => { e.target.value = mascaraTel(e.target.value); });
    porId('bAddPrio').onclick = async () => {
      const nome = porId('pNovo').value.trim();
      if (!nome) return;
      S.cfg.prioridades = [...(S.cfg.prioridades || []), { nome, cor: porId('pCor').value }];
      await Backend.salvarConfig({ prioridades: S.cfg.prioridades });
      porId('pNovo').value = ''; desenharPrio();
    };
    porId('bSalvarGeral').onclick = async () => {
      const patch = {
        maxParcelas: Number(porId('cMax').value || 36),
        taxaPadrao: Number(String(porId('cTaxa').value).replace(',', '.') || 0) / 100,
        dataReferencia: porId('cData').value.trim(),
        tituloAba: porId('cTitulo').value.trim(),
        whatsappAdm: soDigitos(porId('cWa').value),
        exigirEmailVerificado: porId('cVerif').checked
      };
      await Backend.salvarConfig(patch);
      Object.assign(S.cfg, patch);
      porId('bSalvarGeral').textContent = 'Salvo ✓';
      setTimeout(() => { if (porId('bSalvarGeral')) porId('bSalvarGeral').textContent = 'Salvar regras gerais'; }, 1600);
    };
    porId('bSalvarTermos').onclick = async () => {
      await Backend.salvarConfig({ termos: porId('cTermos').value });
      S.cfg.termos = porId('cTermos').value;
      porId('bSalvarTermos').textContent = 'Salvo ✓';
      setTimeout(() => { if (porId('bSalvarTermos')) porId('bSalvarTermos').textContent = 'Salvar termos'; }, 1600);
    };
    if (porId('bRecomecar')) porId('bRecomecar').onclick = async () => {
      if (!confirm('Apagar tudo que foi criado e recarregar a base original?\n\nVínculos, propostas, chamados e calibragem são perdidos.')) return;
      if (!confirm('Confirmação final: isso não tem volta, a não ser que você tenha copiado o dados/dados.json antes.')) return;
      await Backend.admRecomecar();
      location.reload();
    };
  }

  /* ================================================================
     navegação e ciclo de vida
     ================================================================ */
  const TELAS = { painel: abaPainel, propostas: abaPropostas, chamados: abaChamados,
    credores: abaCredores, calibragem: abaCalibragem, pendencias: abaPendencias, config: abaConfig };

  function irPara(t) {
    S.aba = t;
    document.querySelectorAll('#navAbas .aba').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
    (TELAS[t] || abaPainel)();
  }

  async function recarregar() {
    [S.contas, S.propostas, S.chamados, S.cfg, S.tentativas] = await Promise.all([
      Backend.admContas(), Backend.admPropostas(), Backend.admChamados(), Backend.lerConfig(),
      Backend.admTentativas().catch(() => [])
    ]);
  }


  document.querySelectorAll('#navAbas .aba').forEach(b => b.onclick = () => irPara(b.dataset.t));
  porId('bRecarregar').onclick = async () => { await recarregar(); irPara(S.aba); };
  porId('bSairAdm').onclick = async () => { await Backend.sair(); location.reload(); };

  /* Chamado quando quem entrou é administrador. Esconde a tela do credor e
     mostra o painel: mesma página, mesmo endereço, sem recarregar nada. */
  async function abrir(usuario) {
    S.usuario = usuario;
    document.getElementById('app').classList.add('hide');
    elTopo.classList.remove('hide');
    el.classList.remove('hide');
    porId('tagModo').textContent = Backend.rotulo;
    porId('quemSou').textContent = usuario.email;
    render(`<div class="card card-pad center muted">Carregando…</div>`);
    await recarregar();
    irPara('painel');
  }

  return { abrir };
})();


</script>
<script>
(async function () {
  await Backend.init();
  const app = document.getElementById('app');
  if (!Backend.pronto) {
    /* de fora, o visitante não precisa saber de bastidor; do próprio
       computador, quem cuida do site precisa */
    const emCasa = /^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
    app.innerHTML = emCasa ? Backend.htmlIndisponivelLocal() : Backend.htmlIndisponivel();
    return;
  }
  if (Backend.servidorDesatualizado) { app.innerHTML = Backend.htmlServidorAntigo(); return; }
  await Credor.iniciar();
})();
</script>
</body>
</html>
