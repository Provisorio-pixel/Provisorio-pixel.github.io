/* ==================================================================
   core.js — utilitários + camada de dados.

   MODELO DE ACESSO (mudou em 10/09/2026)
   A chave de acesso é o CPF + os 4 últimos dígitos do telefone, não
   mais o e-mail. Qualquer e-mail pode criar um login; no primeiro
   acesso a pessoa informa CPF e 4 dígitos, e o site VINCULA aquele
   login à conta dela na base. Dali em diante o banco só devolve as
   contas cujo uid é o do login autenticado.

   Funciona em três modos, sempre com a BASE REAL:
     • supabase — produção. Banco Postgres, e quem protege os dados são
       as regras do supabase.sql, do lado do servidor.
     • firebase — produção, alternativa. Mesma ideia, outro fornecedor.
     • servidor local — quando não há chave nenhuma. Fala com o
       servidor.mjs que roda no computador do responsável, e os dados
       ficam em dados/dados.json.
   Sem nenhum dos dois, o site avisa que não está no ar e não mostra tela
   nenhuma. O resto do código não sabe em qual modo está rodando.
   ================================================================== */

/* ---------------- formatação e validação ---------------- */
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtBRL = v => BRL.format(Number(v || 0));
const fmtPct = (v, d = 2) => (Number(v || 0) * 100).toFixed(d).replace('.', ',') + '%';
const soDigitos = s => String(s ?? '').replace(/\D/g, '');

function fmtData(v) {
  if (!v) return '—';
  const d = v?.toDate ? v.toDate() : (v instanceof Date ? v : new Date(v));
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR');
}
function fmtDataHora(v) {
  if (!v) return '—';
  const d = v?.toDate ? v.toDate() : (v instanceof Date ? v : new Date(v));
  if (isNaN(d)) return '—';
  return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}
function msParaData(v) {
  if (!v) return null;
  return v?.toDate ? v.toDate() : new Date(v);
}
function diasDesde(v) {
  const d = msParaData(v);
  if (!d || isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function hojeISO() { return new Date().toISOString().slice(0, 10); }

function mascaraDoc(v) {
  const d = soDigitos(v);
  if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
  if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  return v || '';
}
function mascaraTel(v) {
  const d = soDigitos(v);
  if (d.length === 11) return d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
  if (d.length === 10) return d.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');
  return v || '';
}
function validaCPF(v) {
  const c = soDigitos(v);
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  for (const i of [9, 10]) {
    let s = 0;
    for (let j = 0; j < i; j++) s += Number(c[j]) * ((i + 1) - j);
    if ((s * 10) % 11 % 10 !== Number(c[i])) return false;

function validaCNPJ(v) {
  const c = soDigitos(v);

function mascaraEmail(e) {
  const [u, d] = String(e || '').split('@');
  if (!u || !d) return '';
  return (u.length <= 2 ? u[0] + '*' : u.slice(0, 3) + '*'.repeat(Math.max(3, u.length - 3))) + '@' + d;
}
const validaEmail = v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v || '').trim());

/* ---------------- cálculo das simulações ----------------
   A taxa nunca é exibida em tela: só o valor da parcela, o total
   e o percentual em relação ao saldo devedor.                        */
function calcParcela(saldo, taxaMensal, n) {
  saldo = Number(saldo || 0); n = Number(n || 1);
  const i = Number(taxaMensal || 0);
  if (n <= 0) return 0;
  if (!i) return saldo / n;
  return saldo * i / (1 - Math.pow(1 + i, -n));
}
function simularParcelamento(saldo, taxaMensal, n) {
  const parcela = calcParcela(saldo, taxaMensal, n);
  const total = parcela * n;
  return {
    parcelas: n,
    valorParcela: Math.round(parcela * 100) / 100,
    valorTotal: Math.round(total * 100) / 100,
    percentual: saldo > 0 ? total / saldo : 0
  };
}
/* ---------------- campos de dinheiro ----------------
   O usuário digita só números e o campo mostra sempre 0.000,00.   */
const moedaTexto = v => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const moedaValor = txt => Number(soDigitos(txt)) / 100;
function ligarMoeda(el) {
  if (!el) return;
  const formata = () => { el.value = el.value ? moedaTexto(moedaValor(el.value)) : ''; };
  el.addEventListener('input', formata);
  el.addEventListener('blur', formata);
  formata();
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const Srv = {
  CHAVE_TOKEN: 'cd_token',
  _u: null,
  _cbs: [],

  /* versão mínima do servidor.mjs que esta página sabe usar. Se a
     janela preta estiver rodando uma versão mais antiga (coisa comum:
     o arquivo foi trocado mas o servidor continuou aberto), a página
     avisa em vez de travar num botão. */
  VERSAO_MINIMA: 2,
  versaoServidor: 0,

  async disponivel() {
    if (!/^https?:$/.test(location.protocol)) return false;
    try {
      const r = await fetch('api/ping', { cache: 'no-store' });
      if (!r.ok) return false;
      const j = await r.json();
      this.versaoServidor = Number(j.api || 1);
      return !!j.ok;
    } catch (e) { return false; }
  },

  _token() { try { return sessionStorage.getItem(this.CHAVE_TOKEN) || ''; } catch (e) { return this.__t || ''; } },
  _guardaToken(t) { try { t ? sessionStorage.setItem(this.CHAVE_TOKEN, t) : sessionStorage.removeItem(this.CHAVE_TOKEN); } catch (e) { this.__t = t; } },

  async _req(rota, opcoes = {}) {
    const cab = { 'Content-Type': 'application/json' };
    const t = this._token();
    if (t) cab.Authorization = 'Bearer ' + t;
    const r = await fetch('api' + rota, {
      method: opcoes.metodo || 'GET',
      headers: cab,
      cache: 'no-store',
      body: opcoes.dados !== undefined ? JSON.stringify(opcoes.dados) : undefined
    });
    let j = null;
    try { j = await r.json(); } catch (e) { j = {}; }
    if (!r.ok) {
      const err = new Error(j.erro || j.code || ('http ' + r.status));
      err.code = j.code; err.status = r.status; err.corpo = j;
      if (r.status === 403 && /^campo /.test(String(j.erro || '')))
        err.servidorAntigo = true;
      throw err;
    }
    return j;
  },

  /* ---------- autenticação ---------- */
  async criarAcesso(email, senha) {
    const j = await this._req('/criar', { metodo: 'POST', dados: { email, senha } });
    this._guardaToken(j.token);
    this._u = { email: j.email, uid: j.uid, emailVerificado: j.emailVerificado };
    this._notificar();
    return this._u;
  },
  async entrar(email, senha) {
    const j = await this._req('/entrar', { metodo: 'POST', dados: { email, senha } });
    this._guardaToken(j.token);
    this._u = { email: j.email, uid: j.uid, emailVerificado: j.emailVerificado };
    this._notificar();
    return this._u;
  },
  async reenviarVerificacao() { return true; },
  async conferirVerificacao() {
    await this._req('/verificar', { metodo: 'POST', dados: {} });
    if (this._u) this._u.emailVerificado = true;
    return true;
  },
  async recuperarSenha() { return true; },
  async sair() {
    try { await this._req('/sair', { metodo: 'POST', dados: {} }); } catch (e) {}
    this._guardaToken('');
    this._u = null;
    this._notificar();
  },
  aoMudarUsuario(cb) {
    this._cbs.push(cb);
    (async () => {
      if (this._token()) {
        try {
          const j = await this._req('/eu');
          this._u = { email: j.email, uid: j.uid, emailVerificado: true };
        } catch (e) { this._guardaToken(''); this._u = null; }
      }
      cb(this._u);
    })();
    return () => { this._cbs = this._cbs.filter(x => x !== cb); };
  },
  _notificar() { this._cbs.forEach(cb => cb(this._u)); },
  async ehAdmin() {
    try { return !!(await this._req('/eu')).admin; } catch (e) { return false; }
  },

  /* ---------- config ---------- */
  async lerConfig() {
    try { return { ...CONFIG_PADRAO, ...(await this._req('/config')) }; }
    catch (e) { return { ...CONFIG_PADRAO }; }
  },
  async salvarConfig(patch) { return this._req('/config', { metodo: 'POST', dados: patch }); },

  /* ---------- credor ---------- */
  async minhasContas() { return this._req('/minhas-contas'); },
  async lerTentativas() { return this._req('/tentativas-minhas'); },
  async registrarTentativa(uid, cpf, ult4) {
    return (await this._req('/tentativa', { metodo: 'POST', dados: { cpf, ult4 } })).n;
  },
  async procurarPorChave(cpf, ult4) {
    try { return await this._req('/procurar?cpf=' + encodeURIComponent(cpf) + '&ult4=' + encodeURIComponent(ult4)); }
    catch (e) { if (e.status === 429 || e.status === 400) return []; throw e; }
  },
  async situacaoDaChave(cpf, ult4) {

  async admChamados() { return this._req('/adm/chamados'); },

  },
  async admDesvincular(id) {
    return this._req('/adm/desvincular/' + encodeURIComponent(id), { metodo: 'POST', dados: {} });
  },

  },
  async admRecomecar() { return this._req('/adm/recomecar', { metodo: 'POST', dados: {} }); },

  agora() { return new Date().toISOString(); }
};

/* ================================================================
   SUPABASE — o banco de produção.

   Mesma interface do servidor local: as telas não sabem em qual dos
   dois estão rodando. Quem protege os dados aqui não é este arquivo,
   é o supabase.sql — Row Level Security e gatilhos, do lado do
   servidor. Este código só pede; o banco é que decide.
   ================================================================ */
const Sup = {
  _sb: null,
  _u: null,
  _cbs: [],

  async _ligar(cfg) {
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.45.4');
    this._sb = createClient(cfg.url, cfg.anonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    return true;
  },

  _pessoa(u) {
    if (!u) return null;
    return {
      email: (u.email || '').toLowerCase(),
      uid: u.id,
      /* o Supabase só entrega sessão depois do e-mail confirmado,
         então ter sessão já quer dizer confirmado */
      emailVerificado: !!(u.email_confirmed_at || u.confirmed_at)
    };
  },

  _erro(e) {
    if (!e) return;
    const err = new Error(e.message || 'erro');
    const m = String(e.message || '').toLowerCase();
    if (m.includes('already registered') || m.includes('already been registered'))
      err.code = 'auth/email-already-in-use';
    else if (m.includes('invalid login')) err.code = 'auth/invalid-credential';
    else if (m.includes('password') && m.includes('6')) err.code = 'auth/weak-password';
    else if (m.includes('email') && m.includes('invalid')) err.code = 'auth/invalid-email';
    else if (m.includes('rate') || m.includes('too many')) err.code = 'auth/too-many-requests';
    else if (m.includes('not confirmed')) err.code = 'auth/email-nao-confirmado';
    err.original = e;
    throw err;
  },

  /* ---------- autenticação ---------- */
  async criarAcesso(email, senha) {
    const e = String(email).trim().toLowerCase();
    const { data, error } = await this._sb.auth.signUp({ email: e, password: senha });
    if (error) this._erro(error);
    /* sem sessão = o Supabase mandou o e-mail de confirmação e está
       esperando a pessoa clicar no link */
    return { email: e, uid: data.user ? data.user.id : null,
             emailVerificado: !!data.session, precisaConfirmar: !data.session };
  },

  async entrar(email, senha) {
    const e = String(email).trim().toLowerCase();
    const { data, error } = await this._sb.auth.signInWithPassword({ email: e, password: senha });
    if (error) this._erro(error);
    return this._pessoa(data.user);
  },

  async reenviarVerificacao(email) {
    const e = String(email || (this._u && this._u.email) || '').trim().toLowerCase();
    if (!e) return;
    const { error } = await this._sb.auth.resend({ type: 'signup', email: e });
    if (error) this._erro(error);
  },

  async conferirVerificacao() {
    const { data } = await this._sb.auth.getUser();
    return !!(data && data.user && (data.user.email_confirmed_at || data.user.confirmed_at));
  },

  async recuperarSenha(email) {
    const e = String(email).trim().toLowerCase();
    const { error } = await this._sb.auth.resetPasswordForEmail(e, {
      redirectTo: location.origin + location.pathname
    });
    if (error) this._erro(error);
  },

  async sair() { await this._sb.auth.signOut(); },

  aoMudarUsuario(cb) {
    this._cbs.push(cb);
    this._sb.auth.getSession().then(({ data }) => {
      this._u = this._pessoa(data.session ? data.session.user : null);
      cb(this._u);
    });
    const { data: sub } = this._sb.auth.onAuthStateChange((_ev, sessao) => {
      this._u = this._pessoa(sessao ? sessao.user : null);
      this._cbs.forEach(f => f(this._u));
    });
    return () => sub.subscription.unsubscribe();
  },

  async ehAdmin(uid) {
    const { data } = await this._sb.from('admins').select('uid').eq('uid', uid).maybeSingle();
    return !!data;
  },

  /* ---------- config ---------- */
  async lerConfig() {
    const { data } = await this._sb.from('config').select('dados').eq('id', 'geral').maybeSingle();
    return { ...CONFIG_PADRAO, ...((data && data.dados) || {}) };
  },
  async salvarConfig(patch) {
    const atual = await this.lerConfig();
    const { error } = await this._sb.from('config')
      .upsert({ id: 'geral', dados: { ...atual, ...patch } });
    if (error) this._erro(error);
  },

  /* ---------- credor ---------- */
  async minhasContas(uid) {
    const { data, error } = await this._sb.from('contas').select('*')
      .eq('uid', uid).eq('ativo', true);
    if (error) this._erro(error);
    return data || [];
  },

  async lerTentativas(uid) {
    const { data } = await this._sb.from('tentativas').select('*').eq('uid', uid).maybeSingle();
    return data || { n: 0 };
  },

  async registrarTentativa(uid, cpf, ult4) {
    const atual = await this.lerTentativas(uid);
    const n = Number(atual.n || 0) + 1;
    if (!atual.n) {
      const { error } = await this._sb.from('tentativas')
        .insert({ uid, n: 1, cpf, ult4, em: new Date().toISOString() });
      if (error) this._erro(error);
      return 1;
    }
    const { error } = await this._sb.from('tentativas')
      .update({ n, cpf, ult4, em: new Date().toISOString() }).eq('uid', uid);
    if (error) this._erro(error);
    return n;
  },

  /* As regras do banco só devolvem a conta se a tentativa acima tiver
     sido registrada com esta mesma chave e dentro do limite. */
  async procurarPorChave(cpf, ult4) {
    /* duas consultas em vez de um "or" com nome de coluna em maiúsculas:
       evita depender de como o PostgREST interpreta ult4Alt no filtro */
    const achados = new Map();
    for (const campo of ['ult4', 'ult4Alt']) {
      const { data } = await this._sb.from('contas').select('*')
        .eq('cpf', cpf).eq(campo, ult4).is('uid', null).eq('ativo', true);
      (data || []).forEach(c => achados.set(c.id, c));
    }
    return [...achados.values()];
  },

  /* Como as regras escondem as contas já vinculadas, daqui não dá
     para distinguir os casos — igual ao Firebase. */
  async situacaoDaChave() { return { situacao: 'desconhecida' }; },

  async vincularConta(id, uid, email) {
    const { error } = await this._sb.from('contas').update({ uid }).eq('id', id);
    if (error) this._erro(error);
  },

  async atualizarConta(id, patch) {
    const { error } = await this._sb.from('contas').update(patch).eq('id', id);
    if (error) this._erro(error);
  },

  /* ---------- propostas ---------- */
  async propostasDaConta(contaId) {
    const { data, error } = await this._sb.from('propostas').select('*')
      .eq('contaId', contaId).order('criadoEm', { ascending: false });
    if (error) return [];
    return data || [];
  },

  async criarProposta(p) {
    const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const agora = new Date().toISOString();
    const { error } = await this._sb.from('propostas')
      .insert({ ...p, id, criadoEm: agora, ultimaInteracaoEm: agora });
    if (error) this._erro(error);
    return id;
  },

  async atualizarProposta(id, patch) {
    const { error } = await this._sb.from('propostas')
      .update({ ...patch, ultimaInteracaoEm: new Date().toISOString() }).eq('id', id);
    if (error) this._erro(error);
  },

  /* ---------- chamados ---------- */
  async abrirChamado(c) {
    const id = 'ch' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const { error } = await this._sb.from('chamados')
      .insert({ ...c, id, status: 'aberto', respostaAdm: null, criadoEm: new Date().toISOString() });
    if (error) this._erro(error);
    return id;
  },

  /* ---------- administração ---------- */
  async admContas() {
    const todas = [];
    let de = 0;
    /* a API devolve no máximo 1000 por vez; a base é menor que isso,
       mas o laço deixa pronto para crescer */
    for (;;) {
      const { data, error } = await this._sb.from('contas').select('*')
        .order('saldoDevedor', { ascending: false }).range(de, de + 999);
      if (error) this._erro(error);
      todas.push(...(data || []));
      if (!data || data.length < 1000) break;
      de += 1000;
    }
    return todas;
  },
  async admPropostas() {
    const { data, error } = await this._sb.from('propostas').select('*')
      .order('criadoEm', { ascending: false });
    if (error) this._erro(error);
    return data || [];
  },
  async admChamados() {
    const { data, error } = await this._sb.from('chamados').select('*')
      .order('criadoEm', { ascending: false });
    if (error) this._erro(error);
    return data || [];
  },
  async admTentativas() {
    const { data } = await this._sb.from('tentativas').select('*').order('em', { ascending: false });
    return (data || []).map(t => ({ ...t, id: t.uid }));
  },
  async admAtualizarChamado(id, patch) {
    const { error } = await this._sb.from('chamados').update(patch).eq('id', id);
    if (error) this._erro(error);
  },

  /* Desvincular devolve a conta para a fila. O aceite do termo e a
     confirmação de telefone também caem: eles são da PESSOA, não da
     conta, e quem entrar depois precisa aceitar de novo. */
  async admDesvincular(id) {
    const { error } = await this._sb.from('contas').update({
      uid: null, emailAcesso: '', vinculadoEm: null,
      termosAceitos: false, termosAceitosEm: null, telefoneConfirmado: false
    }).eq('id', id);
    if (error) this._erro(error);
  },

  async admZerarTentativas(uid) {
    const { error } = await this._sb.from('tentativas').delete().eq('uid', uid);
    if (error) this._erro(error);
  },

  async admRecomecar() {
    throw new Error('No banco de produção, recomeçar do zero é feito pelo importador.');
  },

  agora() { return new Date().toISOString(); }
};

const Backend = {
  modo: 'indisponivel',
  _fb: null,

  async init() {
    /* 1º) Supabase, quando o bloco SUPABASE_CONFIG tem chaves reais */
    const sup = (typeof SUPABASE_CONFIG !== 'undefined') ? SUPABASE_CONFIG : null;
    const supOk = sup && sup.url && sup.anonKey
      && !/COLE_AQUI|SUA_|xxxx/i.test(JSON.stringify(sup));
    if (supOk) {
      try {
        await Sup._ligar(sup);
        Object.assign(this, Sup);
        this.modo = 'supabase';
        return this.modo;
      } catch (e) {
        console.error('Não consegui falar com o Supabase.', e);
        this.modo = 'indisponivel';
        return this.modo;
      }
    }

    /* 2º) Firebase, se alguém tiver colado chaves dele */
    const cfg = (typeof FIREBASE_CONFIG !== 'undefined') ? FIREBASE_CONFIG : null;
    const valido = cfg && cfg.apiKey && !/COLE_AQUI|SUA_|xxxx/i.test(JSON.stringify(cfg));
    if (!valido) {
      /* sem chaves do Firebase: usa o servidor local que roda no
         computador do responsável */
      if (await Srv.disponivel()) {
        Object.assign(this, Srv);
        this.modo = 'servidor';
        return this.modo;
      }
      this.modo = 'indisponivel';
      return this.modo;
    }
    try {
      const V = '10.14.1';
      const [app, auth, fs] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
      ]);
      const a = app.initializeApp(cfg);
      this._fb = { app: a, auth: auth.getAuth(a), db: fs.getFirestore(a), A: auth, F: fs };
      await auth.setPersistence(this._fb.auth, auth.browserSessionPersistence).catch(() => {});
      this.modo = 'firebase';
    } catch (e) {
      console.error('Não consegui falar com o Firebase.', e);
      this.modo = 'indisponivel';
    }
    return this.modo;
  },

  get local() { return this.modo === 'servidor'; },
  get servidorDesatualizado() {
    return this.modo === 'servidor' && Srv.versaoServidor < Srv.VERSAO_MINIMA;
  },

  /* frase curta e acionável para mostrar quando uma gravação falha */
  explicaErro(e) {
    if (e && (e.servidorAntigo || this.servidorDesatualizado))
      return 'O servidor que está rodando é de uma versão anterior à desta página. '
        + 'Feche a janela preta e clique no iniciar.bat de novo — os dados são mantidos.';
    if (e && e.status === 403) return 'O servidor recusou esta alteração.';
    if (e && e.status === 401) return 'Sua sessão expirou. Saia e entre de novo.';
    return 'Não foi possível salvar agora. Verifique se a janela preta do servidor '
      + 'continua aberta e tente de novo.';
  },
  get pronto() {
    return this.modo === 'supabase' || this.modo === 'firebase' || this.modo === 'servidor';
  },
  get rotulo() { return this.modo === 'servidor' ? 'servidor local' : 'produção'; },

  /* o servidor.mjs aberto é mais antigo do que esta página */
  htmlServidorAntigo() {
    return `<div style="max-width:520px;margin:8vh auto 0">
      <div class="card card-pad stack">
        <h1>Reinicie o servidor</h1>
        <p class="muted">Os arquivos do site foram atualizados, mas a janela preta que está
        aberta no seu computador ainda está rodando a versão anterior. Enquanto isso, algumas
        telas não conseguem salvar.</p>
        <div class="note note-info">
          <strong>O que fazer:</strong> feche a janela preta do servidor e clique no
          <strong>iniciar.bat</strong> de novo. Depois recarregue esta página.
          <br><br>Nada se perde: os dados ficam no arquivo, não na janela.
        </div>
      </div>
    </div>`;
  },

  /* tela mostrada quando não há nem Firebase nem servidor local */
  htmlIndisponivel() {
    return `<div style="max-width:520px;margin:8vh auto 0">
      <div class="card card-pad stack">
        <h1>Em configuração</h1>
        <p class="muted">Esta área ainda não está disponível para consulta.
        Se você recebeu este endereço, guarde-o: em breve ele vai funcionar.</p>
      </div>
    </div>`;
  },

  /* mesma situação, mas explicada para quem cuida do site — só aparece
     quando a página está aberta do próprio computador */
  htmlIndisponivelLocal() {
    return `<div style="max-width:520px;margin:8vh auto 0">
      <div class="card card-pad stack">
        <h1>O site não está no ar</h1>
        <p class="muted">Esta página precisa de um dos dois para funcionar:</p>
        <div class="note note-info">
          <strong>No seu computador:</strong> feche esta aba e clique em
          <strong>iniciar.bat</strong>, na pasta do projeto. Ele liga o servidor e abre o
          endereço certo. Abrir o arquivo direto, com duplo clique, não funciona.
        </div>
        <div class="note note-info">
          <strong>Publicado na internet:</strong> as chaves do Supabase precisam estar
          coladas no começo do index.html. O PUBLICAR-NO-AR.md explica onde pegar.
        </div>
      </div>
    </div>`;
  },

  /* ---------- autenticação: qualquer e-mail pode criar acesso ---------- */
  async criarAcesso(email, senha) {
    const e = String(email).trim().toLowerCase();
    const { createUserWithEmailAndPassword, sendEmailVerification } = this._fb.A;
    const cred = await createUserWithEmailAndPassword(this._fb.auth, e, senha);
    await sendEmailVerification(cred.user).catch(() => {});
    return { email: cred.user.email, uid: cred.user.uid, emailVerificado: false };
  },

  async entrar(email, senha) {
    const e = String(email).trim().toLowerCase();
    const { signInWithEmailAndPassword } = this._fb.A;
    const cred = await signInWithEmailAndPassword(this._fb.auth, e, senha);
    return { email: cred.user.email, uid: cred.user.uid, emailVerificado: cred.user.emailVerified };
  },

  async reenviarVerificacao() {
    const u = this._fb.auth.currentUser;
    if (!u) return;
    return this._fb.A.sendEmailVerification(u);
  },

  /* Depois que a pessoa clica no link do e-mail, o token em memória
     ainda diz que não está verificado — é preciso recarregar. */
  async conferirVerificacao() {
    const u = this._fb.auth.currentUser;
    if (!u) return false;
    await u.reload();
    await u.getIdToken(true);
    return u.emailVerified;
  },

  async recuperarSenha(email) {
    const e = String(email).trim().toLowerCase();
    return this._fb.A.sendPasswordResetEmail(this._fb.auth, e);
  },

  async sair() {
    return this._fb.A.signOut(this._fb.auth);
  },

  aoMudarUsuario(cb) {
    return this._fb.A.onAuthStateChanged(this._fb.auth, u => cb(u
      ? { email: (u.email || '').toLowerCase(), uid: u.uid, emailVerificado: u.emailVerified }
      : null));
  },

  async ehAdmin(uid) {
    const { doc, getDoc } = this._fb.F;
    return (await getDoc(doc(this._fb.db, 'admins', uid))).exists();
  },

  /* ---------- config ---------- */
  async lerConfig() {
    const { doc, getDoc } = this._fb.F;
    const s = await getDoc(doc(this._fb.db, 'config', 'geral'));
    return s.exists() ? { ...CONFIG_PADRAO, ...s.data() } : { ...CONFIG_PADRAO };
  },
  async salvarConfig(patch) {
    const { doc, setDoc } = this._fb.F;
    return setDoc(doc(this._fb.db, 'config', 'geral'), patch, { merge: true });
  },

  /* ---------- contas já vinculadas ao login ---------- */
  async minhasContas(uid) {
    const { collection, query, where, getDocs } = this._fb.F;
    const s = await getDocs(query(collection(this._fb.db, 'contas'),
      where('uid', '==', uid), where('ativo', '==', true)));
    return s.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  /* ---------- identificação e vínculo ----------
     1) registra a tentativa (contador que só sobe, gravado no banco);
     2) procura a conta por CPF + 4 dígitos, entre as ainda sem vínculo;
     3) grava o uid e o e-mail do login na conta.
     As regras do Firestore só liberam o passo 2 se o passo 1 tiver
     acontecido com esses mesmos dados e com o contador dentro do limite. */
  async lerTentativas(uid) {
    const { doc, getDoc } = this._fb.F;
    const s = await getDoc(doc(this._fb.db, 'tentativas', uid));
    return s.exists() ? s.data() : { n: 0 };
  },

  async registrarTentativa(uid, cpf, ult4) {
    const { doc, getDoc, setDoc, updateDoc, serverTimestamp } = this._fb.F;
    const ref = doc(this._fb.db, 'tentativas', uid);
    const atual = await getDoc(ref);
    if (!atual.exists()) {
      await setDoc(ref, { n: 1, cpf, ult4, em: serverTimestamp() });
      return 1;
    }
    const n = Number(atual.data().n || 0) + 1;
    await updateDoc(ref, { n, cpf, ult4, em: serverTimestamp() });
    return n;
  },

  async procurarPorChave(cpf, ult4) {
    const { collection, query, where, getDocs } = this._fb.F;
    const achados = new Map();
    for (const campo of ['ult4', 'ult4Alt']) {
      const s = await getDocs(query(collection(this._fb.db, 'contas'),
        where('cpf', '==', cpf), where(campo, '==', ult4),
        where('uid', '==', null), where('ativo', '==', true))).catch(() => null);
      if (s) s.docs.forEach(d => achados.set(d.id, { id: d.id, ...d.data() }));
    }
    return [...achados.values()];
  },

  /* Por que a chave não achou nada. No Firebase as regras escondem
     contas já vinculadas, então lá a resposta é sempre 'desconhecida'. */
  async situacaoDaChave(cpf, ult4) {
    return { situacao: 'desconhecida' };
  },

  async vincularConta(id, uid, email) {
    const { doc, updateDoc, serverTimestamp } = this._fb.F;
    return updateDoc(doc(this._fb.db, 'contas', id), {
      uid, emailAcesso: email, vinculadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
    });
  },

  async atualizarConta(id, patch) {
    const { doc, updateDoc, serverTimestamp } = this._fb.F;
    return updateDoc(doc(this._fb.db, 'contas', id), { ...patch, atualizadoEm: serverTimestamp() });
  },

  /* ---------- propostas ---------- */
  async propostasDaConta(contaId) {
    const { collection, query, where, getDocs } = this._fb.F;
    const s = await getDocs(query(collection(this._fb.db, 'propostas'), where('contaId', '==', contaId)));
    return s.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (msParaData(b.criadoEm) || 0) - (msParaData(a.criadoEm) || 0));
  },

  async criarProposta(p) {
    const { collection, addDoc, serverTimestamp } = this._fb.F;
    const ref = await addDoc(collection(this._fb.db, 'propostas'), {
      ...p, criadoEm: serverTimestamp(), ultimaInteracaoEm: serverTimestamp()
    });
    return ref.id;
  },

  async atualizarProposta(id, patch) {
    const { doc, updateDoc, serverTimestamp } = this._fb.F;
    return updateDoc(doc(this._fb.db, 'propostas', id), { ...patch, ultimaInteracaoEm: serverTimestamp() });
  },

  /* ---------- chamados ---------- */
  async abrirChamado(c) {
    const { collection, addDoc, serverTimestamp } = this._fb.F;
    const ref = await addDoc(collection(this._fb.db, 'chamados'),
      { ...c, status: 'aberto', criadoEm: serverTimestamp() });
    return ref.id;
  },

  /* ---------- administração ---------- */
  async admContas() {
    const { collection, getDocs } = this._fb.F;
    return (await getDocs(collection(this._fb.db, 'contas'))).docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async admPropostas() {
    const { collection, getDocs } = this._fb.F;
    return (await getDocs(collection(this._fb.db, 'propostas'))).docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async admChamados() {
    const { collection, getDocs } = this._fb.F;
    return (await getDocs(collection(this._fb.db, 'chamados'))).docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async admAtualizarChamado(id, patch) {
    const { doc, updateDoc } = this._fb.F;
    return updateDoc(doc(this._fb.db, 'chamados', id), patch);
  },
  /* solta a conta para ser vinculada de novo (pessoa errou o login, trocou de e-mail…) */
  async admDesvincular(id) {
    const { doc, updateDoc, serverTimestamp } = this._fb.F;
    return updateDoc(doc(this._fb.db, 'contas', id), {
      uid: null, emailAcesso: '', vinculadoEm: null,
      termosAceitos: false, termosAceitosEm: null, telefoneConfirmado: false,
      atualizadoEm: serverTimestamp()
    });
  },
  /* devolve tentativas de identificação a quem estourou o limite */
  async admZerarTentativas(uid) {
    const { doc, deleteDoc } = this._fb.F;
    return deleteDoc(doc(this._fb.db, 'tentativas', uid));
  },
  async admTentativas() {
    const { collection, getDocs } = this._fb.F;
    return (await getDocs(collection(this._fb.db, 'tentativas'))).docs.map(d => ({ uid: d.id, ...d.data() }));
  },

  agora() { return this._fb.F.serverTimestamp(); }
};

</script>
<script>
const Credor = (function () {
  /* ==================================================================
     Área do credor.

     Regras que o código respeita, por decisão do responsável:
     • Nenhuma marca, nome de empresa, autoria ou rodapé em tela.
     • O acesso é criado com O E-MAIL QUE ESTÁ NA BASE daquela conta.
       Quem não tem e-mail cadastrado fala com o responsável, que o
       inclui pelo painel. O banco é que garante isso, não a tela.
     • A identificação é por CPF + 4 últimos dígitos do telefone. No
       primeiro acesso, o site vincula o login à conta da pessoa.
     • Os quatro valores são fixos e não editáveis.
     • A taxa de juros nunca é exibida — só reais e percentuais.
     • Uma proposta em aberto por vez, por conta.
     ================================================================== */

  const S = {
    usuario: null, contas: [], contasVisiveis: [], propostas: [], cfg: null,
    tentativas: 0, erradas: 0, contaSel: null, aba: 'parcelamento'
  };
  const el = document.getElementById('app');
  const elModais = document.getElementById('modais');
  const KEY_IDENT = 'cd_ident';

  /* ---------------- utilidades de tela ---------------- */
  const render = h => { el.innerHTML = h; };
  const porId = id => document.getElementById(id);
  const ligar = (sel, ev, fn) => el.querySelectorAll(sel).forEach(n => n.addEventListener(ev, fn));
  const aviso = (t, k = 'info') => `<div class="note note-${k}">${escHtml(t)}</div>`;

  function modal({ titulo, corpo, acoes }) {
    elModais.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h2>${escHtml(titulo)}</h2>
        <button class="btn-ghost btn-sm" id="mFechar" aria-label="Fechar">✕</button></div>
      <div class="modal-body">${corpo}</div>
      <div class="modal-foot">${acoes}</div></div></div>`;
    porId('mFechar').onclick = fecharModal;
    porId('mbg').addEventListener('click', e => { if (e.target.id === 'mbg') fecharModal(); });
  }
  const fecharModal = () => { elModais.innerHTML = ''; };

  function identOk() { try { return sessionStorage.getItem(KEY_IDENT); } catch (e) { return S._ident || null; } }
  function setIdent(cpf) { try { sessionStorage.setItem(KEY_IDENT, cpf); } catch (e) { S._ident = cpf; } }
  function limpaIdent() { try { sessionStorage.removeItem(KEY_IDENT); } catch (e) { S._ident = null; } }

  /* ================================================================
     1. LOGIN — com o e-mail que está no cadastro
     ================================================================ */
  function telaLogin(erro = '', modo = 'entrar', emailPre = '') {
    render(`
    <div style="max-width:430px;margin:6vh auto 0">
      <div class="card card-pad stack">
        <div>
          <h1>Área de consulta</h1>
          <p class="muted tiny" style="margin-top:4px">Use o <strong>e-mail que você tem cadastrado
            com a gente</strong>. Na etapa seguinte você confirma sua identidade com CPF e telefone.</p>
        </div>
        <div class="abas" role="tablist">
          <button class="aba" role="tab" aria-selected="${modo === 'entrar'}" data-modo="entrar">Entrar</button>
          <button class="aba" role="tab" aria-selected="${modo === 'criar'}" data-modo="criar">Criar acesso</button>
        </div>
        ${erro ? aviso(erro, 'bad') : ''}
        <form id="fLogin" class="stack" autocomplete="on">
          <div class="field">
            <label for="iEmail">E-mail</label>
            <input id="iEmail" type="email" inputmode="email" autocomplete="username" required value="${escHtml(emailPre)}">
            ${modo === 'criar' ? '<div class="help">Precisa ser o e-mail que consta no nosso cadastro. Se você não sabe qual é, ou se mudou de e-mail, use "Não consigo entrar".</div>' : ''}
          </div>
          <div class="field">
            <label for="iSenha">Senha</label>
            <input id="iSenha" type="password" autocomplete="${modo === 'criar' ? 'new-password' : 'current-password'}" required minlength="6">
            ${modo === 'criar' ? '<div class="help">Mínimo de 6 caracteres.</div>' : ''}
          </div>
          ${modo === 'criar' ? `<div class="field">
            <label for="iSenha2">Repita a senha</label>
            <input id="iSenha2" type="password" autocomplete="new-password" required minlength="6">
          </div>` : ''}
          <button class="btn-primary btn-block" type="submit" id="bEnviar">
            ${modo === 'criar' ? 'Criar acesso' : 'Entrar'}
          </button>
        </form>
        <div class="row-between">
          <button class="btn-ghost btn-sm" id="bEsqueci">Esqueci minha senha</button>
          <button class="btn-ghost btn-sm" id="bChamado">Não consigo entrar</button>
        </div>
      </div>
      <div class="center" style="margin-top:16px">
        <button class="btn-ghost btn-sm" id="bAdm" style="opacity:.55">Acesso do responsável</button>
      </div>
    </div>`);

    ligar('.aba', 'click', e => telaLogin('', e.currentTarget.dataset.modo, porId('iEmail').value));
    porId('bChamado').onclick = () => telaChamado();
    porId('bAdm').onclick = () => telaLoginResponsavel();
    /* Não há envio de e-mail neste site: a senha é redefinida pelo
       responsável, a pedido, por atendimento. Prometer um link que
       nunca chega seria pior do que não ter o botão. */
    porId('bEsqueci').onclick = () => {
      modal({
        titulo: 'Esqueceu a senha?',
        corpo: `<p>A redefinição é feita pelo nosso atendimento, não por e-mail automático.</p>
          <p class="muted tiny">Abra um atendimento informando seu nome completo, CPF e telefone.
          Confirmamos sua identidade e liberamos uma senha nova.</p>`,
        acoes: `<button id="mFechar2">Fechar</button>
                <button class="btn-primary" id="mAtend">Abrir atendimento</button>`
      });
      porId('mFechar2').onclick = fecharModal;
      porId('mAtend').onclick = () => { fecharModal(); telaChamado(); };
    };

    porId('fLogin').onsubmit = async ev => {
      ev.preventDefault();
      const b = porId('bEnviar'); b.disabled = true; b.textContent = 'Aguarde…';
      const email = porId('iEmail').value.trim().toLowerCase();
      const senha = porId('iSenha').value;
      try {
        if (modo === 'criar') {
          if (senha !== porId('iSenha2').value) throw { code: 'senhas-diferentes' };
          await Backend.criarAcesso(email, senha);
        } else {
          await Backend.entrar(email, senha);
        }
      } catch (e) {
        b.disabled = false; b.textContent = modo === 'criar' ? 'Criar acesso' : 'Entrar';
        telaLogin(msgErroAuth(e), modo, email);
      }
    };
  }

  /* Mesma página, mesmo endereço: o botão "Acesso do responsável" só troca
     o formulário. Quem entra aqui e é administrador vê o painel aparecer
     no lugar da tela do credor, sem sair do site. */
  function telaLoginResponsavel(erro = '') {
    render(`
    <div style="max-width:400px;margin:10vh auto 0">
      <div class="card card-pad stack">
        <h1>Acesso do responsável</h1>
        ${erro ? aviso(erro, 'bad') : ''}
        <form id="fAdm" class="stack" autocomplete="on">
          <div class="field"><label for="aEmail">E-mail</label>
            <input id="aEmail" type="email" autocomplete="username" required></div>
          <div class="field"><label for="aSenha">Senha</label>
            <input id="aSenha" type="password" autocomplete="current-password" required></div>
          <button class="btn-primary btn-block" type="submit" id="bEntrarAdm">Entrar</button>
        </form>
        <div class="center">
          <button class="btn-ghost btn-sm" id="bVoltar">Voltar</button>
        </div>
      </div>
    </div>`);
    porId('bVoltar').onclick = () => telaLogin();
    porId('fAdm').onsubmit = async ev => {
      ev.preventDefault();
      const b = porId('bEntrarAdm'); b.disabled = true; b.textContent = 'Aguarde…';
      try { await Backend.entrar(porId('aEmail').value.trim().toLowerCase(), porId('aSenha').value); }
      catch (e) {
        b.disabled = false; b.textContent = 'Entrar';
        telaLoginResponsavel('E-mail ou senha não conferem.');
      }
    };
  }

  function msgErroAuth(e) {
    const c = e?.code || '';
    if (c === 'senhas-diferentes') return 'As duas senhas não são iguais.';
    if (c === 'auth/email-already-in-use') return 'Já existe um acesso com este e-mail. Use a aba "Entrar".';
    if (c === 'auth/weak-password') return 'A senha precisa ter pelo menos 6 caracteres.';
    if (c === 'auth/invalid-email') return 'E-mail inválido.';
    if (c === 'auth/too-many-requests') return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
    if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found')
      return 'E-mail ou senha não conferem. Se você ainda não tem acesso, use a aba "Criar acesso".';
    return 'Não foi possível entrar. Tente novamente em instantes.';
  }

  /* ================================================================
     2. CONFIRMAÇÃO DO E-MAIL
     ================================================================ */
  function telaVerificarEmail(msg = '') {
    render(`
    <div style="max-width:460px;margin:7vh auto 0">
      <div class="card card-pad stack">
        <h1>Confirme seu e-mail</h1>
        <p class="muted">Enviamos um link para <strong>${escHtml(S.usuario.email)}</strong>.
          Abra o e-mail, clique no link e volte aqui. Verifique também a caixa de spam.</p>
        ${msg ? aviso(msg, 'warn') : ''}
        <button class="btn-primary btn-block" id="bJa">Já confirmei, continuar</button>
        <div class="row-between">
          <button class="btn-ghost btn-sm" id="bReenviar">Reenviar o link</button>
          <button class="btn-ghost btn-sm" id="bSairV">Sair</button>
        </div>
      </div>
    </div>`);
    porId('bSairV').onclick = sair;
    porId('bReenviar').onclick = async () => {
      porId('bReenviar').disabled = true;
      try { await Backend.reenviarVerificacao(); } catch (e) {}
      telaVerificarEmail('Link reenviado. Pode levar alguns minutos para chegar.');
    };
    porId('bJa').onclick = async () => {
      const b = porId('bJa'); b.disabled = true; b.textContent = 'Conferindo…';
      const ok = await Backend.conferirVerificacao().catch(() => false);
      if (!ok) return telaVerificarEmail('Ainda não consta como confirmado. Clique no link do e-mail e tente de novo.');
      S.usuario.emailVerificado = true;
      iniciarSessao();
    };
  }

  /* ================================================================
     3. CHAMADO (quem não consegue entrar)
     ================================================================ */
  function telaChamado(deLogado = false) {
    render(`
    <div style="max-width:480px;margin:5vh auto 0">
      <div class="card card-pad stack">
        <div>
          <h1>Abrir atendimento</h1>
          <p class="muted tiny" style="margin-top:4px">Preencha os campos abaixo. O contato de retorno é feito pelo WhatsApp informado.</p>
        </div>
        <div id="chErro"></div>
        <form id="fCh" class="stack">
          <div class="field">
            <label for="chNome">Nome completo</label>
            <input id="chNome" required autocomplete="name" placeholder="Como está no documento">
          </div>
          <div class="field">
            <label for="chCpf">CPF</label>
            <input id="chCpf" required inputmode="numeric" placeholder="000.000.000-00" maxlength="18">
          </div>
          <div class="field">
            <label for="chTel">Telefone com DDD</label>
            <input id="chTel" required inputmode="tel" placeholder="(00) 00000-0000" maxlength="16">
          </div>
          <div class="field">
            <label for="chMsg">O que aconteceu (opcional)</label>
            <textarea id="chMsg" maxlength="500" placeholder="Ex: digitei meu CPF e não reconheceu"></textarea>
          </div>
          <button class="btn-primary btn-block" type="submit" id="bCh">Enviar</button>
        </form>
        <button class="btn-ghost btn-sm" id="bVoltar">Voltar</button>
      </div>
    </div>`);

    porId('chCpf').addEventListener('input', e => { e.target.value = mascaraDoc(e.target.value); });
    porId('chTel').addEventListener('input', e => { e.target.value = mascaraTel(e.target.value); });
    porId('bVoltar').onclick = () => deLogado ? telaPainel() : (S.usuario ? telaIdentificacao() : telaLogin());

    porId('fCh').onsubmit = async ev => {
      ev.preventDefault();
      const nome = porId('chNome').value.trim();
      const cpf = soDigitos(porId('chCpf').value);
      const tel = soDigitos(porId('chTel').value);
      const erros = [];
      if (nome.split(/\s+/).length < 2) erros.push('Informe o nome completo.');
      if (!validaDoc(cpf)) erros.push('CPF inválido.');
      if (tel.length < 10) erros.push('Telefone incompleto — inclua o DDD.');
      if (erros.length) { porId('chErro').innerHTML = aviso(erros.join(' '), 'bad'); return; }
      const b = porId('bCh'); b.disabled = true; b.textContent = 'Enviando…';
      try {
        await Backend.abrirChamado({
          tipo: 'acesso', nomeCompleto: nome, cpf, telefone: tel,
          email: S.usuario?.email || '', uidSolicitante: S.usuario?.uid || '',
          mensagem: porId('chMsg').value.trim(), conferencia: {}
        });
        render(`<div style="max-width:480px;margin:8vh auto 0"><div class="card card-pad stack center">
          <h1>Atendimento registrado</h1>
          <p class="muted">Vamos entrar em contato pelo WhatsApp <strong>${escHtml(mascaraTel(tel))}</strong> para confirmar sua identidade e liberar o acesso.</p>
          <button class="btn-primary" id="bFim">Voltar ao início</button></div></div>`);
        porId('bFim').onclick = () => deLogado ? telaPainel() : (S.usuario ? telaIdentificacao() : telaLogin());
      } catch (e) {
        b.disabled = false; b.textContent = 'Enviar';
        porId('chErro').innerHTML = aviso('Não foi possível registrar agora. Tente novamente em instantes.', 'bad');
      }
    };
  }

  /* ================================================================
     4. IDENTIFICAÇÃO — CPF + 4 últimos dígitos do telefone
        Se o login ainda não tem conta vinculada, é aqui que o vínculo
        é criado. Nesse caso as tentativas são contadas no banco.
     ================================================================ */
  function telaIdentificacao(erro = '') {
    const vincular = S.contas.length === 0;
    const restantes = MAX_TENTATIVAS - S.tentativas;
    const bloqueado = vincular ? restantes <= 0 : S.erradas >= 5;
    render(`
    <div style="max-width:440px;margin:6vh auto 0">
      <div class="card card-pad stack">
        <div>
          <h1>Confirmação de identidade</h1>
          <p class="muted tiny" style="margin-top:4px">${vincular
            ? 'Informe o CPF e os 4 últimos dígitos do telefone que você tem cadastrado com a gente. É o que liga este acesso à sua posição.'
            : 'Para exibir sua posição, confirme os dados abaixo.'}</p>
        </div>
        ${erro ? aviso(erro, 'bad') : ''}
        ${bloqueado ? aviso(vincular
          ? 'Você atingiu o limite de tentativas. Por segurança, abra um atendimento para confirmarmos seus dados por WhatsApp.'
          : 'Muitas tentativas. Abra um atendimento para conferirmos seus dados.', 'warn') : ''}
        ${!bloqueado && vincular && S.tentativas > 0 ? aviso('Tentativas restantes: ' + restantes + '.', 'warn') : ''}
        <form id="fId" class="stack">
          <div class="field">
            <label for="idCpf">CPF ou CNPJ do titular</label>
            <input id="idCpf" required inputmode="numeric" maxlength="18" placeholder="000.000.000-00" ${bloqueado ? 'disabled' : ''}>
          </div>
          <div class="field">
            <label for="idTel">4 últimos dígitos do seu telefone</label>
            <input id="idTel" required inputmode="numeric" maxlength="4" placeholder="0000" ${bloqueado ? 'disabled' : ''}>
          </div>
          <button class="btn-primary btn-block" type="submit" id="bId" ${bloqueado ? 'disabled' : ''}>Confirmar</button>
        </form>
        <div class="row-between">
          <button class="btn-ghost btn-sm" id="bSair">Sair</button>
          <button class="btn-ghost btn-sm" id="bCh2">Não consigo confirmar</button>
        </div>
      </div>
    </div>`);
    if (!bloqueado) {
      porId('idCpf').addEventListener('input', e => { e.target.value = mascaraDoc(e.target.value); });
      porId('idTel').addEventListener('input', e => { e.target.value = soDigitos(e.target.value).slice(0, 4); });
    }
    porId('bSair').onclick = sair;
    porId('bCh2').onclick = () => telaChamado(false);
    porId('fId').onsubmit = ev => { ev.preventDefault(); confirmarIdentidade(); };
  }

  async function confirmarIdentidade() {
    const cpf = soDigitos(porId('idCpf').value);
    const t4 = soDigitos(porId('idTel').value);
    const b = porId('bId'); b.disabled = true; b.textContent = 'Conferindo…';

    /* login já vinculado: a conferência é contra as contas que já são dele */
    if (S.contas.length) {
      const casam = S.contas.filter(c => c.cpf === cpf && [c.ult4, c.ult4Alt].includes(t4));
      if (!casam.length) { S.erradas++; return telaIdentificacao('Dados não confirmados. Confira o CPF e os 4 dígitos.'); }
      setIdent(cpf);
      S.contasVisiveis = casam;
      S.contaSel = casam[0].id;
      await carregarPropostas();
      return prosseguirParaTermos();
    }

    /* login novo: registra a tentativa e tenta criar o vínculo */
    try {
      S.tentativas = await Backend.registrarTentativa(S.usuario.uid, cpf, t4);
      if (S.tentativas > MAX_TENTATIVAS) return telaIdentificacao();
      const achados = await Backend.procurarPorChave(cpf, t4);
      if (!achados.length) {
        /* pode ser dado errado, mas também pode ser uma conta que já foi
           reivindicada por outro acesso, ou uma negociação já concluída */
        const r = await Backend.situacaoDaChave(cpf, t4).catch(() => ({ situacao: 'desconhecida' }));
        const sit = r && r.situacao ? r.situacao : r;
        if (sit === 'ja_vinculada') {
          return telaIdentificacao('Estes dados já estão ligados ao acesso '
            + (r.email ? r.email : 'criado antes')
            + '. Saia e entre com esse e-mail e a senha que você usou. Se não lembra a senha, use "Esqueci minha senha"; se não é seu, abra um atendimento.');
        }
        if (sit === 'bloqueada') {
          return telaIdentificacao('A consulta desta posição está encerrada no momento. Abra um atendimento e retornamos pelo WhatsApp.');
        }
        return telaIdentificacao('Não encontramos esses dados. Três coisas precisam bater: '
          + 'o e-mail deste acesso, o CPF e os 4 últimos dígitos do telefone — todos como estão '
          + 'no nosso cadastro. Se você criou o acesso com outro e-mail, ou se mudou de e-mail '
          + 'ou de telefone, abra um atendimento. Se a sua negociação já foi concluída, a consulta '
          + 'é encerrada.');
      }
      for (const c of achados) {
        await Backend.vincularConta(c.id, S.usuario.uid, S.usuario.email);
      }
      S.contas = await Backend.minhasContas(S.usuario.uid);
      setIdent(cpf);
      S.contasVisiveis = S.contas.filter(c => c.cpf === cpf);
      S.contaSel = S.contasVisiveis[0]?.id;
      await carregarPropostas();
      prosseguirParaTermos();
    } catch (e) {
      console.error(e);
      telaIdentificacao('Não foi possível confirmar agora. Tente novamente em instantes.');
    }
  }

  /* ================================================================
     5. TERMOS
     ================================================================ */
  function prosseguirParaTermos() {
    if (!S.contasVisiveis.length) return telaSemAcesso();
    if (S.contasVisiveis.some(c => !c.termosAceitos)) return telaTermos();
    telaPainel();
  }

  function telaTermos() {
    render(`
    <div style="max-width:640px;margin:4vh auto 0">
      <div class="card card-pad stack">
        <h1>Termo de confirmação de leitura</h1>
        <div class="termos-box">${escHtml(S.cfg.termos || '')}</div>
        <label class="check"><input type="checkbox" id="ckTermos">
          <span>Declaro que li e aceito integralmente o termo acima.</span></label>
        <button class="btn-primary btn-block" id="bAceitar" disabled>Aceitar e continuar</button>
        <button class="btn-ghost btn-sm" id="bSair2">Sair sem aceitar</button>
      </div>
    </div>`);
    porId('ckTermos').onchange = e => { porId('bAceitar').disabled = !e.target.checked; };
    porId('bSair2').onclick = sair;
    porId('bAceitar').onclick = async () => {
      const b = porId('bAceitar'); b.disabled = true; b.textContent = 'Registrando…';
      const em = Backend.agora();
      for (const c of S.contasVisiveis) {
        if (c.termosAceitos) continue;
        await Backend.atualizarConta(c.id, { termosAceitos: true, termosAceitosEm: em });
        c.termosAceitos = true; c.termosAceitosEm = new Date().toISOString();
      }
      telaPainel();

  function telaPainel() {
    if (!S.contasVisiveis.length) return telaSemAcesso();

    S.contaSel = c.id;
    const aberta = propostaAbertaDaConta(c.id);
    const combinada = S.propostas.find(p => p.contaId === c.id && p.dataPagamentoPrevista && ['aceita', 'paga'].includes(p.status));

    render(`
    <div class="row-between no-print" style="margin-bottom:14px">
      <div class="tiny muted">${escHtml(S.usuario.email)}</div>
      <div class="row">
        <button class="btn-ghost btn-sm" onclick="window.print()">Imprimir</button>
        <button class="btn-ghost btn-sm" id="bSair3">Sair</button>
      </div>
    </div>

    ${S.contasVisiveis.length > 1 ? `
    <div class="card card-pad no-print" style="margin-bottom:14px">

      <select id="selConta">
        ${S.contasVisiveis.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${escHtml(x.contaLabel || x.nome)} — ${fmtBRL(x.saldoDevedor)}</option>`).join('')}

    <div class="card card-pad no-print" style="margin-top:18px">

      ${aberta ? `<div style="margin-top:12px">${aviso(
        aberta.origem === 'adm'
          ? 'Existe uma proposta aguardando a sua resposta logo abaixo. Responda para poder enviar uma nova.'
          : 'Sua proposta está em análise. Você poderá enviar outra depois que ela for respondida.', 'warn')}</div>` : `
      <div class="abas" role="tablist" style="margin-top:14px">
        <button class="aba" role="tab" data-aba="parcelamento" aria-selected="${S.aba === 'parcelamento'}">Parcelamento</button>
        <button class="aba" role="tab" data-aba="quitacao" aria-selected="${S.aba === 'quitacao'}">Quitação à vista</button>
      </div>
      <div id="painelSim" style="margin-top:16px"></div>`}
    </div>

    <div class="card card-pad no-print" style="margin-top:14px">
      <h2>Minhas propostas</h2>

    </div>

    ${blocoMeusDados(c)}

      <button class="btn-ghost btn-sm" id="bCh3">Abrir atendimento</button>
    </div>`);

    porId('bSair3').onclick = sair;
    porId('bCh3').onclick = () => telaChamado(true);

    if (!aberta) {
      ligar('.aba', 'click', e => { S.aba = e.currentTarget.dataset.aba; telaPainel(); });
      desenharSimulador(c);
    }
    desenharPropostas(c);
  }

  /* ---------------- simulador ---------------- */
  const maxParcelasDa = c => Number(c.maxParcelas || S.cfg.maxParcelas || 36);
  const taxaDa = c => Number(c.taxaMensal ?? S.cfg.taxaPadrao ?? 0);

  function desenharSimulador(c) {
    const box = porId('painelSim');
    if (!box) return;
    const maxP = maxParcelasDa(c);

    if (S.aba === 'parcelamento') {
      box.innerHTML = `
        <div class="field">
          <label for="sQtd">Em quantas parcelas você aceita receber? (até ${maxP})</label>
          <input id="sQtd" type="number" min="1" max="${maxP}" step="1" value="${Math.min(12, maxP)}">
        </div>
        <div id="sResult" style="margin-top:14px"></div>
        <div class="field" style="margin-top:14px">
          <label for="sObs">Observação (opcional, até 300 caracteres)</label>
          <textarea id="sObs" maxlength="300" placeholder="Ex: prefiro receber a partir de novembro"></textarea>
        </div>
        <button class="btn-primary btn-block" id="bProp" style="margin-top:14px">Enviar esta proposta</button>`;
      const atualizar = () => {
        const n = Math.max(1, Math.min(maxP, parseInt(porId('sQtd').value || '1', 10)));
        const r = simularParcelamento(c.saldoDevedor, taxaDa(c), n);
        porId('sResult').innerHTML = `
          <div class="valores">
            <div class="linha-valor"><span class="rot">Número de parcelas</span><span class="val">${r.parcelas}</span></div>
            <div class="linha-valor"><span class="rot">Valor de cada parcela</span><span class="val">${fmtBRL(r.valorParcela)}</span></div>
            <div class="linha-valor"><span class="rot">Total a receber</span><span class="val">${fmtBRL(r.valorTotal)}</span></div>
            <div class="linha-valor"><span class="rot">Em relação ao saldo devedor</span><span class="val">${fmtPct(r.percentual)}</span></div>
          </div>`;
        box._sim = { ...r, tipo: 'parcelamento' };
      };
      porId('sQtd').addEventListener('input', atualizar);
      atualizar();
      porId('bProp').onclick = () => confirmarProposta(c, box._sim, porId('sObs').value.trim());
    } else {
      box.innerHTML = `
        <div class="field">
          <label for="sVal">Quanto você aceita receber à vista, em reais?</label>
          <input id="sVal" inputmode="decimal" placeholder="0,00">
          <div class="help">Saldo devedor atual: ${fmtBRL(c.saldoDevedor)}</div>
        </div>
        <div id="sResult2" style="margin-top:14px"></div>
        <div class="field" style="margin-top:14px">
          <label for="sObs2">Observação (opcional, até 300 caracteres)</label>
          <textarea id="sObs2" maxlength="300"></textarea>
        </div>
        <button class="btn-primary btn-block" id="bProp2" style="margin-top:14px" disabled>Enviar esta proposta</button>`;
      const atualizar = () => {
        const v = Number(soDigitos(porId('sVal').value)) / 100;
        porId('sVal').value = v ? v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
        const pct = c.saldoDevedor > 0 ? v / c.saldoDevedor : 0;
        porId('sResult2').innerHTML = v > 0 ? `
          <div class="valores">
            <div class="linha-valor"><span class="rot">Valor proposto à vista</span><span class="val">${fmtBRL(v)}</span></div>
            <div class="linha-valor"><span class="rot">Em relação ao saldo devedor</span><span class="val">${fmtPct(pct)}</span></div>
          </div>
          ${v > c.saldoDevedor ? aviso('O valor proposto está acima do saldo devedor. Confira antes de enviar.', 'warn') : ''}` : '';
        porId('bProp2').disabled = !(v > 0);
        box._sim = { tipo: 'quitacao', parcelas: 1, valorParcela: v, valorTotal: v, percentual: pct };
      };
      porId('sVal').addEventListener('input', atualizar);
      atualizar();
      porId('bProp2').onclick = () => confirmarProposta(c, box._sim, porId('sObs2').value.trim());
    }
  }
