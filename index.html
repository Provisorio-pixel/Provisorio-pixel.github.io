        <h3 style="margin-top:16px;font-size:.95rem">Endereço</h3>
        <div class="field" style="margin-top:8px">
          <label for="dEnd">Endereço completo <span class="tiny muted">(opcional)</span></label>
          <textarea id="dEnd" maxlength="200" style="min-height:70px">${escHtml(d.endereco)}</textarea>
        </div>`,
      acoes: `<button id="dCancel">Cancelar</button>
              <button class="btn-primary" id="dOk">Confirmar meus dados</button>`
    });

    porId('dWpp').addEventListener('input', e => { e.target.value = mascaraTel(e.target.value); });
    porId('dCancel').onclick = fecharModal;
    porId('dOk').onclick = async () => {
      const novo = {
        whatsapp: soDigitos(porId('dWpp').value),
        pixTipo: porId('dPixTipo').value,
        pixChave: porId('dPix').value.trim(),
        banco: porId('dBanco').value.trim(),
        agencia: porId('dAg').value.trim(),
        contaBanco: porId('dCt').value.trim(),
        tipoContaBanco: porId('dTipoCt').value,
        endereco: porId('dEnd').value.trim()
      };
      if (novo.whatsapp.length < 10)
        return telaDadosRecebimento({ ...c, ...novo }, aoConcluir,
          'Informe o WhatsApp com DDD, ex: (11) 99999-9999.');
      if (!temFormaDeReceber(novo))
        return telaDadosRecebimento({ ...c, ...novo }, aoConcluir,
          'Informe pelo menos uma forma de receber: a chave Pix ou os dados da conta bancária.');

      const b = porId('dOk');
      b.disabled = true; b.textContent = 'Salvando…';
      const marca = {
        ...novo, telefoneConfirmado: true,
        dadosConfirmados: true, dadosConfirmadosEm: new Date().toISOString()
      };
      try {
        await Backend.atualizarConta(c.id, marca);
      } catch (e) {
        console.error(e);
        b.disabled = false; b.textContent = 'Confirmar meus dados';
        return telaDadosRecebimento({ ...c, ...novo }, aoConcluir, Backend.explicaErro(e));
      }
      fecharModal();
      await recarregar().catch(() => {});
      /* usa o que acabou de ser gravado, não depende de a releitura achar a conta */
      const atual = { ...(S.contasVisiveis.find(x => x.id === c.id) || c), ...marca };
      if (aoConcluir) aoConcluir(atual); else telaPainel();
    };
  }

  function blocoMeusDados(c) {
    if (!c.dadosConfirmados) return '';
    const pixRot = (TIPOS_PIX.find(([v]) => v === c.pixTipo) || ['', 'Chave'])[1];
    const linha = (r, v) => v ? `<div class="linha-valor"><span class="rot">${r}</span><span class="val" style="font-weight:600">${escHtml(v)}</span></div>` : '';
    const banco = c.banco
      ? `${c.banco} · Ag ${c.agencia} · ${c.tipoContaBanco === 'poupanca' ? 'Poupança' : 'C/C'} ${c.contaBanco}`
      : '';
    return `
    <div class="card card-pad" style="margin-top:14px">
      <div class="row-between">
        <h2>Meus dados</h2>
        <button class="btn-ghost btn-sm no-print" id="bMeusDados">Alterar</button>
      </div>
      <p class="muted tiny" style="margin-top:4px">Confirmados em ${fmtData(c.dadosConfirmadosEm)}.
      Só você pode alterar estes dados.</p>
      <div class="valores" style="margin-top:12px">
        ${linha('WhatsApp', mascaraTel(c.whatsapp || c.telefone))}
        ${linha('Pix — ' + pixRot, c.pixChave)}
        ${linha('Conta bancária', banco)}
        ${linha('Endereço', c.endereco)}
      </div>
    </div>`;
  }

  function confirmarProposta(c, sim, obs) {
    if (!sim) return;
    /* primeira proposta: confere contato e forma de recebimento antes */
    if (!c.dadosConfirmados)
      return telaDadosRecebimento(c, atual => confirmarProposta(atual, sim, obs));
    const resumo = sim.tipo === 'parcelamento'
      ? `<p><strong>${sim.parcelas} parcelas de ${fmtBRL(sim.valorParcela)}</strong><br>
         Total ${fmtBRL(sim.valorTotal)} — ${fmtPct(sim.percentual)} do saldo devedor.</p>`
      : `<p><strong>${fmtBRL(sim.valorTotal)} à vista</strong><br>
         ${fmtPct(sim.percentual)} do saldo devedor.</p>`;
    modal({
      titulo: 'Confirmar envio da proposta',
      corpo: `${resumo}${obs ? `<p class="muted tiny">Observação: ${escHtml(obs)}</p>` : ''}
        <p class="muted tiny">Enquanto esta proposta não for respondida, você não poderá enviar outra para esta conta.</p>
        <div id="mErro"></div>`,
      acoes: `<button id="mCancel">Cancelar</button><button class="btn-primary" id="mOk">Confirmar envio</button>`
    });
    porId('mCancel').onclick = fecharModal;
    porId('mOk').onclick = async () => {
      const b = porId('mOk');
      b.disabled = true; b.textContent = 'Enviando…';
      let id;
      try {
        id = await Backend.criarProposta({
          contaId: c.id, nome: c.nome, origem: 'credor',
          tipo: sim.tipo, parcelas: sim.parcelas, valorParcela: sim.valorParcela,
          valorTotal: sim.valorTotal, percentual: sim.percentual, obs, status: 'pendente',
          respostaAdm: null, respostaCredor: null, prioridade: c.prioridade || 0,
          saldoBase: c.saldoDevedor, dataPagamentoPrevista: null, respondidoEm: null,
          historico: [{ quem: 'credor', acao: 'criou', texto: obs || '', em: new Date().toISOString() }]
        });
        await Backend.atualizarConta(c.id, { propostaAbertaId: id });
      } catch (e) {
        console.error(e);
        b.disabled = false; b.textContent = 'Confirmar envio';
        porId('mErro').innerHTML = aviso(Backend.explicaErro(e), 'bad');
        return;
      }
      fecharModal();
      await recarregar(); telaPainel();
      modal({
        titulo: 'Proposta registrada',
        corpo: `<p>Sua proposta foi registrada para análise. A resposta aparece nesta página.</p>`,
        acoes: `<button class="btn-primary" onclick="fecharModal()">Fechar</button>`
      });
    };
  }

  /* ---------------- lista de propostas do credor ---------------- */
  const ROTULO_STATUS = {
    pendente: ['Em análise', 'tag-warn'],
    enviada: ['Aguardando sua resposta', 'tag-info'],
    aceita: ['Aceita', 'tag-ok'],
    recusada: ['Não aceita', 'tag-bad'],
    paga: ['Paga', 'tag-neutral']
  };

  function desenharPropostas(c) {
    const box = porId('listaProp');
    if (!box) return;
    const minhas = S.propostas.filter(p => p.contaId === c.id);
    if (!minhas.length) { box.innerHTML = `<p class="muted tiny">Nenhuma proposta registrada nesta conta.</p>`; return; }

    box.innerHTML = minhas.map(p => {
      const [rot, cls] = ROTULO_STATUS[p.status] || [p.status, 'tag-neutral'];
      const desc = p.tipo === 'parcelamento'
        ? `${p.parcelas} parcelas de ${fmtBRL(p.valorParcela)} — total ${fmtBRL(p.valorTotal)}`
        : `${fmtBRL(p.valorTotal)} à vista`;
      return `<div class="card card-pad" style="margin-bottom:10px">
        <div class="row-between">
          <div>
            <div class="tiny muted">${p.origem === 'adm' ? 'Proposta recebida' : 'Proposta enviada por você'} • ${fmtData(p.criadoEm)}</div>
            <div style="font-weight:620;margin-top:3px">${escHtml(desc)}</div>
            <div class="tiny muted">${fmtPct(p.percentual)} do saldo devedor${p.obs ? ' • ' + escHtml(p.obs) : ''}</div>
          </div>
          <span class="tag ${cls}">${rot}</span>
        </div>
        ${p.respostaAdm ? `<div style="margin-top:10px">${aviso('Resposta: ' + p.respostaAdm, p.status === 'recusada' ? 'bad' : 'ok')}</div>` : ''}
        ${p.dataPagamentoPrevista && ['aceita', 'paga'].includes(p.status) ? `<div style="margin-top:10px" class="tiny muted">Data de pagamento combinada: <strong>${fmtData(p.dataPagamentoPrevista)}</strong></div>` : ''}
        ${p.status === 'enviada' ? `<div class="row" style="margin-top:12px">
            <button class="btn-ok btn-sm" data-aceita="${p.id}">Aceitar</button>
            <button class="btn-bad btn-sm" data-recusa="${p.id}">Não aceitar</button>
          </div>` : ''}
        ${p.status === 'aceita' && p.origem === 'adm' && !c.telefoneConfirmado ? `<div style="margin-top:12px">
            <button class="btn-primary btn-sm" data-wpp="${p.id}">Confirmar meu WhatsApp</button></div>` : ''}
        ${p.status === 'recusada' && p.origem === 'adm' ? `<div class="row" style="margin-top:12px">
            <button class="btn-sm" data-contra="${p.id}">Enviar contraproposta</button></div>` : ''}
      </div>`;
    }).join('');

    ligar('[data-aceita]', 'click', e => aceitarPropostaAdm(c, e.currentTarget.dataset.aceita));
    ligar('[data-recusa]', 'click', e => recusarPropostaAdm(c, e.currentTarget.dataset.recusa));
    ligar('[data-wpp]', 'click', () => telaConfirmaWhats(c));
    ligar('[data-contra]', 'click', () => { S.aba = 'parcelamento'; telaPainel(); });
  }

  function aceitarPropostaAdm(c, id) {
    const p = S.propostas.find(x => x.id === id);
    modal({
      titulo: 'Aceitar proposta',
      corpo: `<p>Você confirma o aceite de <strong>${p.tipo === 'parcelamento'
        ? `${p.parcelas} parcelas de ${fmtBRL(p.valorParcela)}`
        : `${fmtBRL(p.valorTotal)} à vista`}</strong>?</p>
        <p class="muted tiny">Depois do aceite, o contato para os detalhes é feito por WhatsApp.</p>`,
      acoes: `<button id="mCancel">Cancelar</button><button class="btn-ok" id="mOk">Aceito</button>`
    });
    porId('mCancel').onclick = fecharModal;
    porId('mOk').onclick = async () => {
      porId('mOk').disabled = true;
      await Backend.atualizarProposta(id, {
        status: 'aceita', respondidoEm: Backend.agora(),
        historico: [...(p.historico || []), { quem: 'credor', acao: 'aceitou', texto: '', em: new Date().toISOString() }]
      });
      await Backend.atualizarConta(c.id, { propostaAbertaId: null });
      fecharModal(); await recarregar(); telaPainel();
      telaConfirmaWhats(S.contasVisiveis.find(x => x.id === c.id) || c);
    };
  }

  function recusarPropostaAdm(c, id) {
    const p = S.propostas.find(x => x.id === id);
    modal({
      titulo: 'Não aceitar a proposta',
      corpo: `<div class="field"><label for="mJust">Justificativa curta (até 200 caracteres)</label>
        <textarea id="mJust" maxlength="200" placeholder="Ex: preciso de um prazo menor"></textarea></div>
        <p class="muted tiny">Depois disso você poderá enviar uma contraproposta.</p>`,
      acoes: `<button id="mCancel">Cancelar</button><button class="btn-bad" id="mOk">Registrar recusa</button>`
    });
    porId('mCancel').onclick = fecharModal;
    porId('mOk').onclick = async () => {
      const just = porId('mJust').value.trim();
      if (!just) return porId('mJust').focus();
      porId('mOk').disabled = true;
      await Backend.atualizarProposta(id, {
        status: 'recusada', respostaCredor: just, respondidoEm: Backend.agora(),
        historico: [...(p.historico || []), { quem: 'credor', acao: 'recusou', texto: just, em: new Date().toISOString() }]
      });
      await Backend.atualizarConta(c.id, { propostaAbertaId: null });
      fecharModal(); await recarregar(); telaPainel();
    };
  }

  function telaConfirmaWhats(c) {
    const tel = mascaraTel(c.telefone);
    modal({
      titulo: 'Contato por WhatsApp',
      corpo: `<p>O contato para acertar os detalhes será feito por WhatsApp, neste número:</p>
        <p style="font-size:1.2rem;font-weight:700" class="mono">${escHtml(tel)}</p>
        <p class="muted tiny">Confirme se este número está correto e é o seu.</p>`,
      acoes: `<button id="mErrado">Este número está errado</button>
              <button class="btn-ok" id="mOk">Confirmo, é o meu número</button>`
    });
    porId('mOk').onclick = async () => {
      porId('mOk').disabled = true;
      await Backend.atualizarConta(c.id, { telefoneConfirmado: true });
      fecharModal(); await recarregar(); telaPainel();
      modal({
        titulo: 'Número confirmado',
        corpo: `<p>Obrigado. Vamos entrar em contato por WhatsApp em <strong>${escHtml(tel)}</strong>.</p>`,
        acoes: `<button class="btn-primary" onclick="fecharModal()">Fechar</button>`
      });
    };
    porId('mErrado').onclick = () => { fecharModal(); telaChamado(true); };
  }

  /* ================================================================
     ciclo de vida
     ================================================================ */
  async function carregarPropostas() {
    const listas = await Promise.all(S.contasVisiveis.map(c => Backend.propostasDaConta(c.id)));
    S.propostas = listas.flat();
  }

  async function recarregar() {
    S.contas = await Backend.minhasContas(S.usuario.uid);
    const cpf = identOk();
    S.contasVisiveis = cpf ? S.contas.filter(c => c.cpf === cpf) : [];
    await carregarPropostas();
  }

  async function sair() {
    limpaIdent();
    await Backend.sair();
    S.usuario = null; S.contas = []; S.contasVisiveis = []; S.propostas = [];
    S.tentativas = 0; S.erradas = 0;
    telaLogin();
  }

  async function iniciarSessao() {
    render(`<div class="card card-pad center muted">Carregando…</div>`);
    if (S.cfg.exigirEmailVerificado && !S.usuario.emailVerificado) return telaVerificarEmail();
    try {
      S.contas = await Backend.minhasContas(S.usuario.uid);
      if (!S.contas.length) {
        S.tentativas = Number((await Backend.lerTentativas(S.usuario.uid)).n || 0);
      }
    } catch (e) {
      console.error(e);
      return render(`<div class="card card-pad stack">${aviso('Não foi possível carregar seus dados agora. Recarregue a página em instantes.', 'bad')}
        <button class="btn-ghost btn-sm" onclick="sair()">Sair</button></div>`);
    }
    const cpf = identOk();
    if (cpf && S.contas.length) {
      S.contasVisiveis = S.contas.filter(c => c.cpf === cpf);
      if (S.contasVisiveis.length) {
        S.contaSel = S.contasVisiveis[0].id;
        await carregarPropostas();
        return prosseguirParaTermos();
      }
    }
    limpaIdent();
    S.erradas = 0;
    telaIdentificacao();
  }

  async function iniciar() {
    S.cfg = await Backend.lerConfig();
    if (S.cfg.tituloAba) document.title = S.cfg.tituloAba;

    Backend.aoMudarUsuario(async u => {
      if (!u) { limpaIdent(); return telaLogin(); }
      S.usuario = u;
      /* o mesmo formulário serve para os dois: se quem entrou for o
         responsável, a própria página troca para o painel — sem sair daqui */
      if (await Backend.ehAdmin(u.uid).catch(() => false)) return Painel.abrir(u);
      iniciarSessao();
    });
  }

  /* handlers usados de dentro do HTML gerado */
  window.fecharModal = fecharModal;
  window.sair = sair;

  return { iniciar, telaLogin };
})();

</script>
<script>
const Painel = (function () {
  /* ==================================================================
     Painel de administração.
     ================================================================== */
  const S = { usuario: null, contas: [], propostas: [], chamados: [], tentativas: [], cfg: null, aba: 'painel',
    cal: { indice: null, parcelas: 12, recorte: 'todos' },
    cred: { situacao: 'todos', faixa: 'todas' },
              filtro: 'nao_respondidas', busca: '', ordem: 'antigas', selLote: new Set() };
  const el = document.getElementById('appAdm');
  const elTopo = document.getElementById('admTopo');
  const elModais = document.getElementById('modais');
  const porId = id => document.getElementById(id);
  const render = h => { el.innerHTML = h; };
  const ligar = (sel, ev, fn) => el.querySelectorAll(sel).forEach(n => n.addEventListener(ev, fn));
  const aviso = (t, k = 'info') => `<div class="note note-${k}">${escHtml(t)}</div>`;

  function modal({ titulo, corpo, acoes, largura }) {
    elModais.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" ${largura ? `style="max-width:${largura}"` : ''}>
      <div class="modal-head"><h2>${escHtml(titulo)}</h2><button class="btn-ghost btn-sm" id="mFechar">✕</button></div>
      <div class="modal-body">${corpo}</div><div class="modal-foot">${acoes}</div></div></div>`;
    porId('mFechar').onclick = fecharModal;
    porId('mbg').addEventListener('click', e => { if (e.target.id === 'mbg') fecharModal(); });
  }
  const fecharModal = () => { elModais.innerHTML = ''; };

  /* ---------------- derivados ---------------- */
  const conta = id => S.contas.find(c => c.id === id);
  const propsDaConta = id => S.propostas.filter(p => p.contaId === id);

  function estadoDaConta(c) {
    if (c.pago) return 'paga';
    const ps = propsDaConta(c.id);
    if (!ps.length) return 'nao';
    if (ps.some(p => ['pendente', 'enviada'].includes(p.status))) return 'neg';
    if (ps.some(p => p.status === 'aceita')) return 'ace';
    return 'sem';
  }
  const ROT_ESTADO = { nao: ['Não iniciada', 'var(--st-nao)'], neg: ['Em negociação', 'var(--st-neg)'],
    ace: ['Aceita', 'var(--st-ace)'], paga: ['Paga', 'var(--st-pag)'], sem: ['Sem acordo', 'var(--st-sem)'] };

  const ROT_PROP = {
    pendente: ['Aguardando você', 'tag-warn'], enviada: ['Aguardando o credor', 'tag-info'],
    aceita: ['Aceita', 'tag-ok'], recusada: ['Recusada', 'tag-bad'], paga: ['Paga', 'tag-neutral']
  };
  function descProp(p) {
    return p.tipo === 'parcelamento'
      ? `${p.parcelas}× ${fmtBRL(p.valorParcela)}`
      : `${fmtBRL(p.valorTotal)} à vista`;
  }
  function prioBadge(n) {
    const pr = (S.cfg.prioridades || [])[Number(n || 0)];
    if (!pr) return '<span class="tiny muted">—</span>';
    return `<span class="prio" style="color:${pr.cor}"><i style="background:${pr.cor}"></i>${escHtml(pr.nome)}</span>`;
  }
  function taxaDa(c) { return Number(c.taxaMensal ?? S.cfg.taxaPadrao ?? 0); }
  function maxParcelasDa(c) { return Number(c.maxParcelas || S.cfg.maxParcelas || 36); }

  /* ================================================================
     PAINEL
     ================================================================ */
  function abaPainel() {
    const ativas = S.contas;
    const total = ativas.reduce((s, c) => s + Number(c.saldoDevedor || 0), 0);
    const grupos = { nao: [], neg: [], ace: [], paga: [], sem: [] };
    ativas.forEach(c => grupos[estadoDaConta(c)].push(c));
    const soma = k => grupos[k].reduce((s, c) => s + Number(c.saldoDevedor || 0), 0);
    const emAberto = total - soma('paga');
    const chAbertos = S.chamados.filter(c => c.status !== 'resolvido').length;
    const semResposta = S.propostas.filter(p => p.status === 'pendente').length;
    const aguardCredor = S.propostas.filter(p => p.status === 'enviada').length;
    const pendCad = S.contas.reduce((s, c) => s + (c.pendencias || []).length, 0);
    const travados = S.tentativas.filter(t => Number(t.n || 0) >= MAX_TENTATIVAS).length;
    const reciboPend = S.contas.filter(c => c.pago && !c.recibo).length;
    const maisAntiga = S.propostas.filter(p => p.status === 'pendente')
      .sort((a, b) => (msParaData(a.ultimaInteracaoEm) || 0) - (msParaData(b.ultimaInteracaoEm) || 0))[0];

    const ordem = ['nao', 'neg', 'ace', 'paga', 'sem'];
    const n = ativas.length || 1;

    render(`
    <div class="stack">
      <div class="card card-pad">
        <div class="dinheiro">
          <div>
            <div class="t-rot">Dívida total cadastrada</div>
            <div class="valor-grande">${fmtBRL(total)}</div>
            <div class="t-sub">${ativas.length} contas na base</div>
          </div>
          <div class="divisor"></div>
          <div>
            <div class="t-rot">Ainda em aberto</div>
            <div class="valor-grande">${fmtBRL(emAberto)}</div>
            <div class="t-sub">${fmtPct(total ? emAberto / total : 0, 1)} do total · já quitado ${fmtBRL(soma('paga'))}</div>
          </div>
        </div>
      </div>

      <div class="tiles">
        ${[['nao', 'Faltam negociar'], ['neg', 'Em negociação'], ['ace', 'Proposta aceita'], ['paga', 'Pagas']]
          .map(([k, rot]) => `<div class="tile">
            <div class="t-rot"><span class="ponto" style="background:${ROT_ESTADO[k][1]}"></span>${rot}</div>
            <div class="t-val">${grupos[k].length} <span class="t-de">de ${ativas.length}</span></div>
            <div class="t-sub">${fmtBRL(soma(k))}</div>
          </div>`).join('')}
      </div>

      <div class="card card-pad">
        <h2>Situação das ${ativas.length} contas</h2>
        <div class="barra" style="margin-top:12px" role="img"
          aria-label="${ordem.map(k => `${ROT_ESTADO[k][0]}: ${grupos[k].length}`).join(', ')}">
          ${ordem.filter(k => grupos[k].length).map((k, i, arr) => `<i style="width:${grupos[k].length / n * 100}%;
            background:${ROT_ESTADO[k][1]};${i < arr.length - 1 ? 'border-right:2px solid var(--surface)' : ''}"></i>`).join('')}
        </div>
        <div class="legenda">
          ${ordem.map(k => `<span><b style="background:${ROT_ESTADO[k][1]}"></b>${ROT_ESTADO[k][0]}
            <strong class="num">${grupos[k].length}</strong>
            <span class="muted">(${fmtBRL(soma(k))})</span></span>`).join('')}
        </div>
      </div>

      <div class="grid2">
        <div class="card card-pad">
          <h2>Precisa de você</h2>
          <dl class="kv" style="margin-top:12px">
            <dt>Propostas que você não respondeu</dt><dd>${semResposta}</dd>
            <dt>Propostas suas aguardando o credor</dt><dd>${aguardCredor}</dd>
            <dt>Chamados abertos</dt><dd>${chAbertos}</dd>
            <dt>Logins travados na identificação</dt><dd>${travados}</dd>
            <dt>Recibos de quitação pendentes</dt><dd>${reciboPend}</dd>
            <dt>Erros de cadastro em aberto</dt><dd>${pendCad}</dd>
          </dl>
          ${maisAntiga ? `<div style="margin-top:14px">${aviso(
            `Proposta mais antiga sem resposta: ${maisAntiga.nome} — ${diasDesde(maisAntiga.ultimaInteracaoEm)} dias parada.`,
            diasDesde(maisAntiga.ultimaInteracaoEm) > 15 ? 'bad' : 'warn')}</div>` : ''}
          <button class="btn-primary btn-sm" style="margin-top:14px" id="bIrProp">Abrir a fila de propostas</button>
        </div>
        <div class="card card-pad">
          <h2>Maiores valores em aberto</h2>
          <div class="tbl-wrap" style="margin-top:12px;border:0">
            <table><tbody>
            ${ativas.filter(c => !c.pago).sort((a, b) => b.saldoDevedor - a.saldoDevedor).slice(0, 8).map(c => {
              const e = estadoDaConta(c);
              return `<tr><td>${escHtml(c.nome)}${c.contaLabel ? ` <span class="tiny muted">${escHtml(c.contaLabel)}</span>` : ''}</td>
                <td><span class="prio" style="color:${ROT_ESTADO[e][1]}"><i style="background:${ROT_ESTADO[e][1]}"></i>${ROT_ESTADO[e][0]}</span></td>
                <td class="num">${fmtBRL(c.saldoDevedor)}</td></tr>`;
            }).join('')}
            </tbody></table>
          </div>
        </div>
      </div>
    </div>`);
    porId('bIrProp').onclick = () => irPara('propostas');
  }

  /* ================================================================
     PROPOSTAS
     ================================================================ */
  const FILTROS = [
    ['nao_respondidas', 'Não respondi', p => p.status === 'pendente'],
    ['enviadas', 'Enviei, aguardo', p => p.status === 'enviada'],
    ['contra', 'Contraproposta', p => p.origem === 'credor' && p.status === 'pendente' && p.contraDe],
    ['aceitas', 'Aceitas', p => p.status === 'aceita'],
    ['recusadas', 'Recusadas', p => p.status === 'recusada'],
    ['pagas', 'Pagas', p => p.status === 'paga'],
    ['todas', 'Todas', () => true]
  ];

  function abaPropostas() {
    const f = FILTROS.find(x => x[0] === S.filtro) || FILTROS[0];
    let lista = S.propostas.filter(f[2]);
    if (S.busca) {
      const b = S.busca.toLowerCase();
      lista = lista.filter(p => (p.nome || '').toLowerCase().includes(b));
    }
    lista.sort((a, b) => S.ordem === 'antigas'
      ? (msParaData(a.ultimaInteracaoEm) || 0) - (msParaData(b.ultimaInteracaoEm) || 0)
      : Number(b.valorTotal || 0) - Number(a.valorTotal || 0));

    render(`
    <div class="stack">
      <div class="card card-pad">
        <div class="row-between">
          <div class="filtros">
            ${FILTROS.map(x => `<button class="chip" data-f="${x[0]}" aria-pressed="${x[0] === S.filtro}">
              ${x[1]}<b>${S.propostas.filter(x[2]).length}</b></button>`).join('')}
          </div>
          <button class="btn-primary btn-sm" id="bNovaProp">Enviar proposta</button>
        </div>
        <div class="row" style="margin-top:12px">
          <input id="iBusca" placeholder="Buscar por nome" value="${escHtml(S.busca)}" style="max-width:280px">
          <select id="iOrdem" style="max-width:220px">
            <option value="antigas" ${S.ordem === 'antigas' ? 'selected' : ''}>Mais antigas primeiro</option>
            <option value="valor" ${S.ordem === 'valor' ? 'selected' : ''}>Maior valor primeiro</option>
          </select>
        </div>
      </div>

      ${lista.length ? `<div class="tbl-wrap"><table>
        <thead><tr>
          <th>Prioridade</th><th>Nome</th><th>Proposta</th><th class="num">Valor</th>
          <th class="num">% do saldo</th><th class="num">Parada há</th><th>Situação</th><th>Origem</th><th></th>
        </tr></thead>
        <tbody>${lista.map(p => {
          const dias = diasDesde(p.ultimaInteracaoEm);
          const [rot, cls] = ROT_PROP[p.status] || [p.status, 'tag-neutral'];
          const c = conta(p.contaId) || {};
          return `<tr>
            <td>${prioBadge(c.prioridade)}</td>
            <td><strong>${escHtml(p.nome || '')}</strong>${c.contaLabel ? `<br><span class="tiny muted">${escHtml(c.contaLabel)}</span>` : ''}</td>
            <td>${p.tipo === 'parcelamento' ? 'Parcelamento' : 'Quitação'}<br><span class="tiny muted">${escHtml(descProp(p))}</span></td>
            <td class="num">${fmtBRL(p.valorTotal)}</td>
            <td class="num">${fmtPct(p.percentual, 1)}</td>
            <td class="num">${dias === null ? '—' : `<span class="${dias > 15 && p.status === 'pendente' ? 'tag tag-bad' : ''}">${dias}d</span>`}</td>
            <td><span class="tag ${cls}">${rot}</span></td>
            <td class="tiny muted">${p.origem === 'adm' ? 'Você' : 'Credor'}</td>
            <td><button class="btn-sm" data-abrir="${p.id}">Abrir</button></td>
          </tr>`;
        }).join('')}</tbody></table></div>`
        : `<div class="card card-pad muted center">Nenhuma proposta neste filtro.</div>`}
    </div>`);

    ligar('.chip', 'click', e => { S.filtro = e.currentTarget.dataset.f; abaPropostas(); });
    porId('iBusca').oninput = e => {
      const v = e.target.value, pos = e.target.selectionStart;
      S.busca = v; abaPropostas();
      const n = porId('iBusca');
      n.value = v; n.focus(); n.setSelectionRange(pos, pos);
    };
    porId('iOrdem').onchange = e => { S.ordem = e.target.value; abaPropostas(); };
    porId('bNovaProp').onclick = () => modalNovaProposta();
    ligar('[data-abrir]', 'click', e => modalProposta(e.currentTarget.dataset.abrir));
  }

  /* ---------------- detalhe da proposta ---------------- */
  /* dados que o credor confirmou ao enviar a primeira proposta.
     Só ele altera — aqui é leitura. */
  const ROT_PIX = { cpf: 'CPF/CNPJ', email: 'E-mail', telefone: 'Telefone', aleatoria: 'Aleatória' };
  function blocoDadosRecebimento(c) {
    if (!c.dadosConfirmados) {
      return `<div class="note note-warn" style="margin-top:12px">O credor ainda não confirmou
        os dados de contato e recebimento. Isso acontece quando ele envia a primeira proposta.</div>`;
    }
    const banco = c.banco
      ? `${escHtml(c.banco)} · Ag ${escHtml(c.agencia)} · ${c.tipoContaBanco === 'poupanca' ? 'Poupança' : 'C/C'} ${escHtml(c.contaBanco)}`
      : '<span class="muted">não informou</span>';
    return `
      <dl class="kv" style="margin-top:12px">
        <dt>WhatsApp</dt><dd>${escHtml(mascaraTel(c.whatsapp || c.telefone))}</dd>
        <dt>Pix (${ROT_PIX[c.pixTipo] || '—'})</dt><dd>${c.pixChave ? escHtml(c.pixChave) : '<span class="muted">não informou</span>'}</dd>
        <dt>Conta bancária</dt><dd>${banco}</dd>
        <dt>Endereço</dt><dd>${c.endereco ? escHtml(c.endereco) : '<span class="muted">não informou</span>'}</dd>
        <dt>Confirmado em</dt><dd>${fmtDataHora(c.dadosConfirmadosEm)}</dd>
      </dl>
      <p class="tiny muted" style="margin-top:6px">Confirmado pelo próprio credor. Só ele pode alterar.</p>`;
  }

  function modalProposta(id) {
    const p = S.propostas.find(x => x.id === id);
    const c = conta(p.contaId) || {};
    const [rot, cls] = ROT_PROP[p.status] || [p.status, 'tag-neutral'];
    modal({
      titulo: p.nome || 'Proposta', largura: '620px',
      corpo: `
        <div class="row-between"><span class="tag ${cls}">${rot}</span>${prioBadge(c.prioridade)}</div>
        <dl class="kv" style="margin-top:14px">
          <dt>Conta</dt><dd>${escHtml(c.contaLabel || '—')} · CPF ${escHtml(mascaraDoc(c.cpf))}</dd>
          <dt>Saldo devedor na data da proposta</dt><dd>${fmtBRL(p.saldoBase)}</dd>
          <dt>Tipo</dt><dd>${p.tipo === 'parcelamento' ? 'Parcelamento' : 'Quitação à vista'}</dd>
          ${p.tipo === 'parcelamento' ? `<dt>Parcelas</dt><dd>${p.parcelas}× de ${fmtBRL(p.valorParcela)}</dd>` : ''}
          <dt>Total</dt><dd>${fmtBRL(p.valorTotal)} (${fmtPct(p.percentual)} do saldo)</dd>
          <dt>Origem</dt><dd>${p.origem === 'adm' ? 'Enviada por você' : 'Enviada pelo credor'}</dd>
          <dt>Criada em</dt><dd>${fmtDataHora(p.criadoEm)}</dd>
          <dt>Última interação</dt><dd>${fmtDataHora(p.ultimaInteracaoEm)} (${diasDesde(p.ultimaInteracaoEm)} dias)</dd>
          ${p.dataPagamentoPrevista ? `<dt>Data de pagamento</dt><dd>${fmtData(p.dataPagamentoPrevista)}</dd>` : ''}
        </dl>
        <div class="sep"></div>
        <h3>Contato e recebimento</h3>
        ${blocoDadosRecebimento(c)}
        ${p.obs ? `<div style="margin-top:12px" class="note note-info">Observação do credor: ${escHtml(p.obs)}</div>` : ''}
        ${p.respostaAdm ? `<div style="margin-top:10px" class="note note-${p.status === 'recusada' ? 'bad' : 'ok'}">Sua resposta: ${escHtml(p.respostaAdm)}</div>` : ''}
        ${p.respostaCredor ? `<div style="margin-top:10px" class="note note-warn">Resposta do credor: ${escHtml(p.respostaCredor)}</div>` : ''}
        <div class="sep"></div>
        <h3>Histórico</h3>
        <div class="tiny muted" style="margin-top:8px">
          ${(p.historico || []).map(h => `<div>• ${fmtDataHora(h.em)} — <strong>${escHtml(h.quem)}</strong> ${escHtml(h.acao)}${h.texto ? ': ' + escHtml(h.texto) : ''}</div>`).join('') || 'Sem registros.'}
        </div>
        <div class="sep"></div>
        <div class="stack">
          <div class="field">
            <label for="mData">Data de pagamento combinada (aparece na tela do credor)</label>
            <input id="mData" type="date" value="${p.dataPagamentoPrevista ? String(p.dataPagamentoPrevista).slice(0, 10) : ''}">
          </div>
          <div class="row">
            <button class="btn-sm" id="mSalvarData">Salvar data</button>
            ${c.telefone ? `<a class="btn btn-sm" target="_blank" rel="noreferrer noopener"
               href="https://wa.me/55${soDigitos(c.whatsapp || c.telefone)}">Abrir WhatsApp</a>` : ''}
          </div>
          ${p.status === 'aceita' && !c.pago ? `<button class="btn-ok btn-sm" id="mPago">Marcar como PAGO</button>` : ''}
          ${c.pago ? `<div class="note note-ok">Pago em ${fmtData(c.dataPagamento)}. Acesso do credor cancelado.
            ${c.recibo ? '<br>Recibo de quitação concluído em ' + fmtData(c.reciboEm) + '.' : ''}</div>
            <div class="row">
              ${!c.recibo ? `<button class="btn-sm" id="mRecibo">Concluir controle de recibo de quitação</button>` : ''}
              <button class="btn-sm btn-bad" id="mDesmarcar">Desmarcar pago e reabilitar acesso</button>
            </div>` : ''}
        </div>`,
      acoes: p.status === 'pendente'
        ? `<button class="btn-bad" id="mNao">Não aceitar</button><button class="btn-ok" id="mSim">Aceitar proposta</button>`
        : `<button class="btn-primary" onclick="fecharModal()">Fechar</button>`
    });

    porId('mSalvarData').onclick = async () => {
      await Backend.atualizarProposta(p.id, { dataPagamentoPrevista: porId('mData').value || null });
      await recarregar(); fecharModal(); irPara(S.aba);
    };
    if (porId('mSim')) porId('mSim').onclick = () => responderProposta(p, true);
    if (porId('mNao')) porId('mNao').onclick = () => responderProposta(p, false);
    if (porId('mPago')) porId('mPago').onclick = () => marcarPago(p, c);
    if (porId('mRecibo')) porId('mRecibo').onclick = () => concluirRecibo(c);
    if (porId('mDesmarcar')) porId('mDesmarcar').onclick = () => desmarcarPago(c);
  }

  function responderProposta(p, aceitar) {
    modal({
      titulo: aceitar ? 'Aceitar proposta' : 'Não aceitar a proposta',
      corpo: `<p>${aceitar
          ? 'O credor verá o aceite e a instrução de contato por WhatsApp, e será convidado a confirmar o número.'
          : 'O credor verá a recusa com a sua justificativa e poderá enviar uma nova proposta.'}</p>
        <div class="field"><label for="mJust">Justificativa curta (até 200 caracteres)</label>
        <textarea id="mJust" maxlength="200" placeholder="${aceitar ? 'Ex: combinado, entro em contato hoje' : 'Ex: valor acima do que consigo neste momento'}"></textarea></div>
        ${aceitar ? `<div class="field"><label for="mData2">Data de pagamento combinada (opcional)</label>
          <input id="mData2" type="date"></div>` : ''}`,
      acoes: `<button id="mCancel">Cancelar</button>
              <button class="${aceitar ? 'btn-ok' : 'btn-bad'}" id="mOk">${aceitar ? 'Confirmar aceite' : 'Confirmar recusa'}</button>`
    });
    porId('mCancel').onclick = fecharModal;
    porId('mOk').onclick = async () => {
      const just = porId('mJust').value.trim();
      if (!just) return porId('mJust').focus();
      porId('mOk').disabled = true;
      await Backend.atualizarProposta(p.id, {
        status: aceitar ? 'aceita' : 'recusada', respostaAdm: just, respondidoEm: Backend.agora(),
        dataPagamentoPrevista: aceitar ? (porId('mData2').value || null) : null,
        historico: [...(p.historico || []), { quem: 'adm', acao: aceitar ? 'aceitou' : 'recusou', texto: just, em: new Date().toISOString() }]
      });
      await Backend.atualizarConta(p.contaId, { propostaAbertaId: null });
      fecharModal(); await recarregar(); irPara(S.aba);
    };
  }

  /* --------- PAGO: duplo OK, cancela acesso --------- */
  function marcarPago(p, c) {
    modal({
      titulo: 'Atenção — esta ação cancela o acesso',
      corpo: `${aviso('Ao marcar como PAGO, o acesso de ' + c.nome + ' ao site é cancelado no mesmo momento. Para reabilitar, você precisa desmarcar o pago.', 'warn')}
        <div class="field" style="margin-top:12px"><label for="mDataPg">Data do pagamento</label>
        <input id="mDataPg" type="date" value="${p.dataPagamentoPrevista ? String(p.dataPagamentoPrevista).slice(0, 10) : hojeISO()}"></div>`,
      acoes: `<button id="mCancel">Cancelar</button><button class="btn-ok" id="mOk1">Ok, continuar</button>`
    });
    porId('mCancel').onclick = fecharModal;
    porId('mOk1').onclick = () => {
      const data = porId('mDataPg').value || hojeISO();
      modal({
        titulo: 'Confirmação final',
        corpo: `<p>Confirma marcar <strong>${escHtml(c.nome)}</strong> como PAGO em <strong>${fmtData(data)}</strong> e cancelar o acesso dessa pessoa?</p>
          ${aviso('Este é o segundo e último Ok.', 'bad')}`,
        acoes: `<button id="mCancel2">Voltar</button><button class="btn-ok" id="mOk2">Confirmar: marcar PAGO</button>`
      });
      porId('mCancel2').onclick = fecharModal;
      porId('mOk2').onclick = async () => {
        porId('mOk2').disabled = true;
        await Backend.atualizarConta(c.id, {
          pago: true, dataPagamento: data, pagoEm: Backend.agora(), ativo: false, recibo: false
        });
        await Backend.atualizarProposta(p.id, {
          status: 'paga', dataPagamentoPrevista: data,
          historico: [...(p.historico || []), { quem: 'adm', acao: 'marcou como paga', texto: 'Pagamento em ' + fmtData(data), em: new Date().toISOString() }]
        });
        fecharModal(); await recarregar(); irPara(S.aba);
      };
    };
  }

  function desmarcarPago(c) {
    modal({
      titulo: 'Desmarcar pago',
      corpo: `<p>Isso reabilita o acesso de <strong>${escHtml(c.nome)}</strong> ao site e zera o controle de recibo.</p>`,
      acoes: `<button id="mCancel">Cancelar</button><button class="btn-bad" id="mOk">Desmarcar e reabilitar</button>`
    });
    porId('mCancel').onclick = fecharModal;
    porId('mOk').onclick = async () => {
      await Backend.atualizarConta(c.id, { pago: false, dataPagamento: null, pagoEm: null, ativo: true, recibo: false, reciboEm: null });
      fecharModal(); await recarregar(); irPara(S.aba);
    };
  }

  function concluirRecibo(c) {
    modal({
      titulo: 'Controle de recibo de quitação',
      corpo: `<p>Confirme que o recibo de quitação de <strong>${escHtml(c.nome)}</strong> já foi emitido e entregue fora do sistema.</p>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="ckRec">
        <span>Recibo emitido e entregue. Encerrar este caso em 100%.</span></label>`,
      acoes: `<button id="mCancel">Cancelar</button><button class="btn-ok" id="mOk" disabled>Concluir</button>`
    });
    porId('mCancel').onclick = fecharModal;
    porId('ckRec').onchange = e => { porId('mOk').disabled = !e.target.checked; };
    porId('mOk').onclick = async () => {
      await Backend.atualizarConta(c.id, { recibo: true, reciboEm: Backend.agora() });
      fecharModal(); await recarregar(); irPara(S.aba);
    };
  }

  /* ---------------- enviar proposta (individual ou em lote) ---------------- */
  function modalNovaProposta() {
    const elegiveis = S.contas.filter(c => !c.pago && c.ativo && !propsDaConta(c.id).some(p => ['pendente', 'enviada'].includes(p.status)));
    modal({
      titulo: 'Enviar proposta', largura: '640px',
      corpo: `
        <div class="abas" role="tablist">
          <button class="aba" role="tab" data-m="um" aria-selected="true">Um credor</button>
          <button class="aba" role="tab" data-m="lote" aria-selected="false">Em lote</button>
        </div>
        <div id="npCorpo" style="margin-top:16px"></div>`,
      acoes: `<button id="mCancel">Cancelar</button><button class="btn-primary" id="mOk">Enviar</button>`
    });
    porId('mCancel').onclick = fecharModal;
    let modo = 'um';
    const desenhar = () => {
      porId('npCorpo').innerHTML = modo === 'um' ? `
        <div class="field"><label for="npConta">Credor</label>
          <select id="npConta">${elegiveis.sort((a, b) => b.saldoDevedor - a.saldoDevedor)
            .map(c => `<option value="${c.id}">${escHtml(c.nome)} ${c.contaLabel ? '(' + escHtml(c.contaLabel) + ')' : ''} — ${fmtBRL(c.saldoDevedor)}</option>`).join('')}</select>
          <div class="help">${elegiveis.length} credores sem proposta em aberto.</div></div>
        ${camposCondicao()}
        <div id="npPrev" style="margin-top:14px"></div>`
        : `
        <div class="field"><label for="npFiltro">Aplicar a</label>
          <select id="npFiltro">
            <option value="todos">Todos os ${elegiveis.length} sem proposta em aberto</option>
            <option value="nao">Só os que nunca negociaram</option>
            ${(S.cfg.prioridades || []).map((pr, i) => `<option value="prio${i}">Prioridade: ${escHtml(pr.nome)}</option>`).join('')}
            ${[...new Set(S.contas.map(c => c.grupo).filter(Boolean))].map(g => `<option value="grupo:${escHtml(g)}">${escHtml(g)}</option>`).join('')}
          </select></div>
        ${camposCondicao(true)}
        <div id="npPrev" style="margin-top:14px"></div>
        ${aviso('Em lote, cada credor recebe a proposta calculada sobre o próprio saldo devedor.', 'info')}`;
      ativarPreview(modo, elegiveis);
    };
    elModais.querySelectorAll('.aba').forEach(b => b.onclick = () => {
      modo = b.dataset.m;
      elModais.querySelectorAll('.aba').forEach(x => x.setAttribute('aria-selected', x.dataset.m === modo));
      desenhar();
    });
    desenhar();
    porId('mOk').onclick = () => enviarPropostaAdm(modo, elegiveis);
  }

  function camposCondicao(lote = false) {
    return `
    <div class="field"><label for="npTipo">Tipo</label>
      <select id="npTipo">
        <option value="parcelamento">Parcelamento</option>
        <option value="quitacao">Quitação à vista</option>
      </select></div>
    <div class="field" id="wrapParc"><label for="npParc">Número de parcelas</label>
      <input id="npParc" type="number" min="1" max="120" value="12"></div>
    <div class="field hide" id="wrapPct"><label for="npPct">Percentual do saldo devedor a pagar à vista (%)</label>
      <input id="npPct" type="number" min="1" max="200" step="0.5" value="70">
      ${lote ? '<div class="help">O valor em reais é calculado sobre o saldo de cada credor.</div>' : ''}</div>
    <div class="field"><label for="npObs">Mensagem para o credor (até 300 caracteres)</label>
      <textarea id="npObs" maxlength="300"></textarea></div>`;
  }

  function alvosLote(elegiveis) {
    const v = porId('npFiltro').value;
    if (v === 'todos') return elegiveis;
    if (v === 'nao') return elegiveis.filter(c => !propsDaConta(c.id).length);
    if (v.startsWith('prio')) return elegiveis.filter(c => Number(c.prioridade || 0) === Number(v.slice(4)));
    if (v.startsWith('grupo:')) return elegiveis.filter(c => c.grupo === v.slice(6));
    return [];
  }

  function ativarPreview(modo, elegiveis) {
    const t = porId('npTipo'), prev = porId('npPrev');
    const atualiza = () => {
      const tipo = t.value;
      porId('wrapParc').classList.toggle('hide', tipo !== 'parcelamento');
      porId('wrapPct').classList.toggle('hide', tipo !== 'quitacao');
      const alvos = modo === 'um' ? [conta(porId('npConta').value)].filter(Boolean) : alvosLote(elegiveis);
      if (!alvos.length) { prev.innerHTML = aviso('Nenhum credor neste recorte.', 'warn'); return; }
      const linhas = alvos.slice(0, 5).map(c => {
        const r = calcular(c, tipo);
        return `<tr><td>${escHtml(c.nome)}</td><td class="num">${fmtBRL(c.saldoDevedor)}</td>
          <td class="num">${tipo === 'parcelamento' ? `${r.parcelas}× ${fmtBRL(r.valorParcela)}` : fmtBRL(r.valorTotal)}</td>
          <td class="num">${fmtPct(r.percentual, 1)}</td></tr>`;
      }).join('');
      const soma = alvos.reduce((s, c) => s + calcular(c, tipo).valorTotal, 0);
      prev.innerHTML = `<div class="tbl-wrap"><table>
        <thead><tr><th>Credor</th><th class="num">Saldo</th><th class="num">Proposta</th><th class="num">%</th></tr></thead>
        <tbody>${linhas}</tbody></table></div>
        <div class="tiny muted" style="margin-top:8px">${alvos.length} credor(es)${alvos.length > 5 ? ' — mostrando os 5 primeiros' : ''}. Soma das propostas: <strong>${fmtBRL(soma)}</strong>.</div>`;
    };
    t.onchange = atualiza;
    ['npParc', 'npPct', 'npConta', 'npFiltro'].forEach(id => { if (porId(id)) porId(id).oninput = porId(id).onchange = atualiza; });
    atualiza();
  }

  function calcular(c, tipo) {
    if (tipo === 'parcelamento') {
      const n = Math.max(1, parseInt(porId('npParc').value || '1', 10));
      return simularParcelamento(c.saldoDevedor, taxaDa(c), n);
    }
    const pct = Number(porId('npPct').value || 0) / 100;
    const v = Math.round(c.saldoDevedor * pct * 100) / 100;
    return { tipo: 'quitacao', parcelas: 1, valorParcela: v, valorTotal: v, percentual: pct };
  }

  async function enviarPropostaAdm(modo, elegiveis) {
    const tipo = porId('npTipo').value;
    const obs = porId('npObs').value.trim();
    const alvos = modo === 'um' ? [conta(porId('npConta').value)].filter(Boolean) : alvosLote(elegiveis);
    if (!alvos.length) return;
    const b = porId('mOk'); b.disabled = true; b.textContent = 'Enviando…';
    for (const c of alvos) {
      const r = calcular(c, tipo);
      const id = await Backend.criarProposta({
        contaId: c.id, nome: c.nome, origem: 'adm', tipo,
        parcelas: r.parcelas, valorParcela: r.valorParcela, valorTotal: r.valorTotal,
        percentual: r.percentual, obs, status: 'enviada', respostaAdm: null, respostaCredor: null,
        prioridade: c.prioridade || 0, saldoBase: c.saldoDevedor, dataPagamentoPrevista: null,
        respondidoEm: null,
        historico: [{ quem: 'adm', acao: 'enviou', texto: obs || descricaoCurta(tipo, r), em: new Date().toISOString() }]
      });
      await Backend.atualizarConta(c.id, { propostaAbertaId: id });
    }
    fecharModal(); await recarregar(); S.filtro = 'enviadas'; irPara('propostas');
  }
  const descricaoCurta = (tipo, r) => tipo === 'parcelamento' ? `${r.parcelas}× de ${fmtBRL(r.valorParcela)}` : `${fmtBRL(r.valorTotal)} à vista`;

  /* ================================================================
     CHAMADOS
     ================================================================ */
  function abaChamados() {
    const abertos = S.chamados.filter(c => c.status !== 'resolvido')
      .sort((a, b) => (msParaData(a.criadoEm) || 0) - (msParaData(b.criadoEm) || 0));
    const fechados = S.chamados.filter(c => c.status === 'resolvido');
    render(`
    <div class="stack">
      ${!soDigitos(S.cfg.whatsappAdm) ? `<div class="card card-pad" style="border-color:#f0dcb4;background:var(--warn-soft)">
        <h2 style="color:var(--warn)">Qual o seu WhatsApp de atendimento?</h2>
        <p class="tiny" style="margin-top:4px;color:var(--warn)">É o número de onde você vai falar com quem abriu chamado.
        Fica guardado e não pergunto de novo — só aparece aqui para você ter à mão, e você troca quando quiser em Configurações.</p>
        <div class="row" style="margin-top:12px">
          <input id="waNovo" inputmode="tel" placeholder="(00) 00000-0000" maxlength="16" style="max-width:220px">
          <button class="btn-primary btn-sm" id="bWaSalvar">Guardar</button>
        </div>
      </div>` : ''}

      <div class="card card-pad">
        <div class="row-between">
          <div>
            <h2>Chamados abertos <span class="tag tag-warn">${abertos.length}</span></h2>
            <p class="muted tiny" style="margin-top:4px">Antes de ajudar com o acesso, confira os três dados com a pessoa pelo WhatsApp: nome completo, CPF e telefone. Marque cada item conferido.</p>
          </div>
          ${soDigitos(S.cfg.whatsappAdm) ? `<div class="right tiny muted">
            Seu WhatsApp de atendimento<br>
            <strong class="mono" style="font-size:.95rem;color:var(--txt)">${escHtml(mascaraTel(S.cfg.whatsappAdm))}</strong>
            <br><button class="btn-ghost btn-sm" id="bWaTrocar">trocar</button></div>` : ''}
        </div>
      </div>
      ${abertos.map(ch => cardChamado(ch)).join('') || '<div class="card card-pad muted center">Nenhum chamado aberto.</div>'}

      <div class="card card-pad">
        <h2>Identificação — tentativas por login</h2>
        <p class="muted tiny" style="margin-top:4px">Cada login tem ${MAX_TENTATIVAS} tentativas para acertar CPF e 4 dígitos.
        É esse limite que impede alguém de descobrir os 4 dígitos por tentativa e erro. Depois de confirmar a identidade
        da pessoa pelo WhatsApp, devolva as tentativas dela aqui.</p>
        ${S.tentativas.length ? `<div class="tbl-wrap" style="margin-top:12px">
          <table><thead><tr><th>Login (uid)</th><th>Último CPF tentado</th><th>4 dígitos</th>
            <th class="num">Tentativas</th><th>Quando</th><th></th></tr></thead>
          <tbody>${S.tentativas.sort((a, b) => Number(b.n || 0) - Number(a.n || 0)).map(t => `<tr>
            <td class="tiny mono">${escHtml(t.uid)}</td>
            <td class="tiny mono">${escHtml(mascaraDoc(t.cpf) || '—')}</td>
            <td class="tiny mono">${escHtml(t.ult4 || '—')}</td>
            <td class="num">${Number(t.n || 0) >= MAX_TENTATIVAS
              ? '<span class="tag tag-bad">' + t.n + ' — travado</span>' : t.n}</td>
            <td class="tiny muted">${fmtDataHora(t.em)}</td>
            <td><button class="btn-sm" data-zerar="${escHtml(t.uid)}">Devolver tentativas</button></td>
          </tr>`).join('')}</tbody></table></div>`
          : '<p class="muted tiny" style="margin-top:12px">Nenhum login tentou se identificar ainda.</p>'}
      </div>
      ${fechados.length ? `<div class="card card-pad">
        <h2>Resolvidos <span class="tag tag-neutral">${fechados.length}</span></h2>
        <div class="tbl-wrap" style="margin-top:12px;border:0"><table>
        <tbody>${fechados.map(ch => `<tr><td>${escHtml(ch.nomeCompleto || '—')}</td>
          <td class="tiny muted">${escHtml(mascaraDoc(ch.cpf))}</td>
          <td class="tiny muted">${fmtData(ch.criadoEm)}</td>
          <td class="tiny muted">${escHtml(ch.notaAdm || '')}</td></tr>`).join('')}</tbody></table></div>
      </div>` : ''}
    </div>`);
    if (porId('waNovo')) {
      porId('waNovo').addEventListener('input', e => { e.target.value = mascaraTel(e.target.value); });
      porId('bWaSalvar').onclick = async () => {
        const t = soDigitos(porId('waNovo').value);
        if (t.length < 10) { alert('Informe o número com DDD.'); return porId('waNovo').focus(); }
        await Backend.salvarConfig({ whatsappAdm: t });
        await recarregar(); irPara('chamados');
      };
    }
    if (porId('bWaTrocar')) porId('bWaTrocar').onclick = async () => {
      await Backend.salvarConfig({ whatsappAdm: '' });
      await recarregar(); irPara('chamados');
    };
    ligar('[data-ch-res]', 'click', e => resolverChamado(e.currentTarget.dataset.chRes));
    ligar('[data-zerar]', 'click', async e => {
      const uid = e.currentTarget.dataset.zerar;
      if (!confirm('Devolver as tentativas de identificação deste login?\n\nFaça isso só depois de confirmar a identidade da pessoa pelo WhatsApp.')) return;
      await Backend.admZerarTentativas(uid);
      await recarregar(); irPara('chamados');
    });
    ligar('[data-ch-ck]', 'change', async e => {
      const [id, campo] = e.currentTarget.dataset.chCk.split('|');
      const ch = S.chamados.find(x => x.id === id);
      const conf = { ...(ch.conferencia || {}), [campo]: e.currentTarget.checked };
      await Backend.admAtualizarChamado(id, { conferencia: conf, status: 'em_atendimento' });
      ch.conferencia = conf; ch.status = 'em_atendimento';
    });
  }

  function cardChamado(ch) {
    const cf = ch.conferencia || {};
    const casa = S.contas.filter(c => c.cpf && c.cpf === soDigitos(ch.cpf));
    return `<div class="card card-pad">
      <div class="row-between">
        <div>
          <div class="kicker">${ch.tipo === 'acesso' ? 'Ajuda com acesso' : 'Proposta'}</div>
          <h2 style="margin-top:3px">${escHtml(ch.nomeCompleto || '—')}</h2>

      </div>

      ${casa.length ? `<div style="margin-top:12px" class="note note-ok">

          saldo ${fmtBRL(c.saldoDevedor)}, ${c.uid ? 'acesso já vinculado a <strong>' + escHtml(c.emailAcesso) + '</strong>' : '<strong>sem acesso vinculado</strong>'}`).join('')}
        </div>`
        : `<div style="margin-top:12px" class="note note-bad">Nenhuma conta na base com este CPF. Confira o número antes de liberar qualquer informação.</div>`}
      <div class="sep"></div>
      <h3>Conferência de identidade</h3>
      <div class="stack" style="margin-top:8px">
        <label class="check"><input type="checkbox" data-ch-ck="${ch.id}|nome" ${cf.nome ? 'checked' : ''}><span>Nome completo confere com o cadastro</span></label>
        <label class="check"><input type="checkbox" data-ch-ck="${ch.id}|cpf" ${cf.cpf ? 'checked' : ''}><span>CPF confere com o cadastro</span></label>
        <label class="check"><input type="checkbox" data-ch-ck="${ch.id}|tel" ${cf.tel ? 'checked' : ''}><span>Telefone confere e a pessoa atendeu nesse número</span></label>
        <label class="check"><input type="checkbox" data-ch-ck="${ch.id}|valor" ${cf.valor ? 'checked' : ''}><span>A pessoa soube dizer um valor de aporte compatível</span></label>
      </div>
      <div class="row" style="margin-top:14px">
        ${ch.telefone ? `<a class="btn btn-sm" target="_blank" rel="noreferrer noopener" href="https://wa.me/55${soDigitos(ch.telefone)}">Abrir WhatsApp</a>` : ''}
        <button class="btn-ok btn-sm" data-ch-res="${ch.id}">Marcar como resolvido</button>
      </div>
    </div>`;
  }

  function resolverChamado(id) {
    const ch = S.chamados.find(x => x.id === id);
    modal({
      titulo: 'Resolver chamado',
      corpo: `<div class="field"><label for="mNota">O que foi feito</label>
        <textarea id="mNota" maxlength="300" placeholder="Ex: identidade confirmada por WhatsApp, orientei a redefinir a senha"></textarea></div>`,
      acoes: `<button id="mCancel">Cancelar</button><button class="btn-ok" id="mOk">Resolver</button>`
    });
    porId('mCancel').onclick = fecharModal;
    porId('mOk').onclick = async () => {
      await Backend.admAtualizarChamado(id, { status: 'resolvido', notaAdm: porId('mNota').value.trim(), resolvidoEm: Backend.agora() });
      fecharModal(); await recarregar(); irPara('chamados');
    };
  }

  /* ================================================================
     CREDORES
     ================================================================ */
  const FAIXA = 50000;
  const curto = v => v >= 1e6
    ? 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi'
    : 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil';
  const rotuloFaixa = i => i === 0
    ? 'Até ' + curto(FAIXA)
    : curto(i * FAIXA) + ' a ' + curto((i + 1) * FAIXA);

  const SITUACOES = [
    ['todos', 'Todos', () => true],
    ['pendencias', 'Com pendência', c => (c.pendencias || []).length > 0],
    ['bloqueados', 'Bloqueados', c => !c.ativo],
    ['liquidados', 'Liquidados', c => !!c.pago],
    ['vinculados', 'Com acesso criado', c => !!c.uid],
    ['sem_vinculo', 'Sem acesso criado', c => !c.uid]
  ];

  function abaCredores() {
    const b = S.busca.trim().toLowerCase();
    const bd = soDigitos(b);   // só compara CPF quando a busca tem dígitos —
                               // senão includes('') casava com todo mundo
    const porBusca = c => !b
      || (c.nome || '').toLowerCase().includes(b)
      || (bd && soDigitos(c.cpf).includes(bd))
      || (bd && soDigitos(c.telefone).includes(bd))
      || String(c.ref ?? '') === b
      || (c.emailCadastro || '').includes(b)
      || (c.emailAcesso || '').includes(b);

    const sit = SITUACOES.find(x => x[0] === S.cred.situacao) || SITUACOES[0];
    const naFaixa = c => S.cred.faixa === 'todas'
      || Math.floor(Number(c.saldoDevedor || 0) / FAIXA) === Number(S.cred.faixa);

    const lista = S.contas.filter(c => porBusca(c) && sit[2](c) && naFaixa(c))
      .sort((x, y) => y.saldoDevedor - x.saldoDevedor);

    /* faixas de 50 mil, só as que têm gente */
    const faixas = {};
    S.contas.filter(c => porBusca(c) && sit[2](c)).forEach(c => {
      const i = Math.floor(Number(c.saldoDevedor || 0) / FAIXA);
      faixas[i] = (faixas[i] || 0) + 1;
    });
    const somaLista = lista.reduce((a, c) => a + Number(c.saldoDevedor || 0), 0);

    render(`
    <div class="stack">
      <div class="card card-pad">
        <div class="filtros">
          ${SITUACOES.map(x => `<button class="chip" data-sit="${x[0]}" aria-pressed="${x[0] === S.cred.situacao}">
            ${x[1]}<b>${S.contas.filter(c => porBusca(c) && x[2](c)).length}</b></button>`).join('')}
        </div>
        <div class="row" style="margin-top:12px">
          <input id="iBusca" placeholder="Buscar por nome, CPF, telefone, ref ou e-mail" value="${escHtml(S.busca)}" style="max-width:320px">
          <select id="iFaixa" style="max-width:250px">
            <option value="todas">Qualquer valor</option>
            ${Object.keys(faixas).map(Number).sort((a, c) => a - c).map(i =>
              `<option value="${i}" ${String(i) === String(S.cred.faixa) ? 'selected' : ''}>${rotuloFaixa(i)} (${faixas[i]})</option>`).join('')}
          </select>
          ${(S.cred.situacao !== 'todos' || S.cred.faixa !== 'todas' || b) ? `<button class="btn-sm" id="bLimpar">Limpar filtros</button>` : ''}
        </div>
        <div class="tiny muted" style="margin-top:10px">
          <strong>${lista.length}</strong> de ${S.contas.length} contas · somam <strong>${fmtBRL(somaLista)}</strong>
          · ${S.contas.filter(c => c.ativo).length} com acesso liberado na base inteira
        </div>
      </div>
      <div class="tbl-wrap"><table class="tbl-credores">
        <colgroup>
          <col class="c-nome"><col class="c-chave"><col class="c-acesso">
          <col class="c-valor"><col class="c-neg"><col class="c-acao">
        </colgroup>
        <thead><tr>
          <th>Credor</th><th>Chave de acesso</th><th>Acesso</th>
          <th class="num">Saldo devedor</th><th>Negociação</th><th></th>
        </tr></thead>
        <tbody>${lista.map(c => {
          const e = estadoDaConta(c);
          const pr = (S.cfg.prioridades || [])[Number(c.prioridade || 0)];
          /* uma coluna só para o acesso: bloqueado manda em tudo; depois
             vem vinculado ou sem acesso, com o e-mail em letra miúda */
          const acesso = !c.ativo
            ? '<span class="tag tag-bad">bloqueado</span>'
            : c.uid
              ? `<span class="tag tag-ok">vinculado</span>
                 <div class="cel-sub" title="${escHtml(c.emailAcesso)}">${escHtml(c.emailAcesso)}</div>`
              : `<span class="tag tag-warn">sem acesso</span>${c.emailCadastro
                  ? `<div class="cel-sub" title="${escHtml(c.emailCadastro)}">${escHtml(c.emailCadastro)}</div>` : ''}`;
          return `<tr data-abrir-conta="${c.id}" style="cursor:pointer">
            <td>
              <div class="cel-nome">${escHtml(c.nome)}</div>
              <div class="cel-tags">
                <span class="cel-ref">#${c.ref ?? '\u2014'}</span>
                ${c.contaLabel ? `<span class="cel-sub">${escHtml(c.contaLabel)}</span>` : ''}
                ${Number(c.prioridade || 0) > 0 && pr
                  ? `<span class="prio" style="color:${pr.cor}"><i style="background:${pr.cor}"></i>${escHtml(pr.nome)}</span>` : ''}
                ${(c.pendencias || []).length ? `<span class="tag tag-warn">${c.pendencias.length} pendência(s)</span>` : ''}
              </div>
            </td>
            <td class="cel-chave mono">${escHtml(mascaraDoc(c.cpf) || '\u2014')}
              <div class="cel-sub mono">4 díg: ${escHtml(c.ult4 || '\u2014')}${c.ult4Alt ? ' / ' + escHtml(c.ult4Alt) : ''}</div>
            </td>
            <td>${acesso}</td>
            <td class="num cel-valor">${fmtBRL(c.saldoDevedor)}</td>
            <td><span class="prio" style="color:${ROT_ESTADO[e][1]}"><i style="background:${ROT_ESTADO[e][1]}"></i>${ROT_ESTADO[e][0]}</span></td>
            <td><button class="btn-sm" data-edit="${c.id}">Editar</button></td>
          </tr>`;
        }).join('')}</tbody></table></div>
    </div>`);
    porId('iBusca').oninput = e => {
      const v = e.target.value, pos = e.target.selectionStart;
      S.busca = v; abaCredores();
      /* o campo é recriado no redesenho: devolve o texto E a posição do
         cursor, senão cada tecla nova entra no começo (073 virava 370) */
      const n = porId('iBusca');
      n.value = v; n.focus(); n.setSelectionRange(pos, pos);
    };
    porId('iFaixa').onchange = e => { S.cred.faixa = e.target.value; abaCredores(); };
    ligar('[data-sit]', 'click', e => { S.cred.situacao = e.currentTarget.dataset.sit; S.cred.faixa = 'todas'; abaCredores(); });
    if (porId('bLimpar')) porId('bLimpar').onclick = () => {
      S.cred = { situacao: 'todos', faixa: 'todas' }; S.busca = ''; abaCredores();
    };
    ligar('[data-edit]', 'click', e => { e.stopPropagation(); modalEditarConta(e.currentTarget.dataset.edit); });
    ligar('[data-abrir-conta]', 'click', e => modalEditarConta(e.currentTarget.dataset.abrirConta));
  }

  function modalEditarConta(id) {
    const c = conta(id);
    modal({
      titulo: c.nome || 'Credor', largura: '640px',
      corpo: `
        ${(c.pendencias || []).length ? `<div class="stack" style="margin-bottom:16px">
          ${c.pendencias.map(p => `<div class="pend-item ${p.severidade}">
            <div class="kicker">${p.severidade}</div>
            <div style="margin-top:3px">${escHtml(p.detalhe)}</div>
            <div class="tiny muted" style="margin-top:4px">${escHtml(p.acao)}</div></div>`).join('')}

        <div class="grid2">
          <div class="field"><label for="eNome">Nome</label><input id="eNome" value="${escHtml(c.nome || '')}"></div>
          <div class="field"><label for="eEmail">E-mail de cadastro (só contato — não é a chave do acesso)</label><input id="eEmail" type="email" value="${escHtml(c.emailCadastro || '')}"></div>
          <div class="field"><label for="eCpf">CPF ou CNPJ</label><input id="eCpf" value="${escHtml(mascaraDoc(c.cpf) || '')}"></div>
          <div class="field"><label for="eTel">Telefone com DDD</label><input id="eTel" value="${escHtml(mascaraTel(c.telefone) || '')}"></div>
          <div class="field"><label for="eAp">Valor aportado (a)</label>

          <div class="field"><label for="eSq">Valor sacado (b)</label>

          <div class="field"><label for="eSd">Saldo devedor final (d)</label>

          <div class="field"><label for="ePrio">Prioridade</label><select id="ePrio">
            ${(S.cfg.prioridades || []).map((pr, i) => `<option value="${i}" ${Number(c.prioridade || 0) === i ? 'selected' : ''}>${escHtml(pr.nome)}</option>`).join('')}
          </select></div>
          <div class="field"><label for="eTaxa">Índice de correção da parcela (% ao mês) — nunca exibido ao credor</label>
            <input id="eTaxa" inputmode="decimal" value="${c.taxaMensal != null ? String(Number(c.taxaMensal) * 100).replace('.', ',') : ''}" placeholder="usa o geral: ${String(Number(S.cfg.taxaPadrao || 0) * 100).replace('.', ',')}"></div>
          <div class="field"><label for="eMaxP">Máximo de parcelas</label>
            <input id="eMaxP" type="number" min="1" max="120" value="${c.maxParcelas || ''}" placeholder="usa o geral: ${S.cfg.maxParcelas}"></div>
        </div>
        <div class="row-between" style="margin-top:12px;padding:10px 12px;background:var(--surface-2);
             border:1px solid var(--line);border-radius:var(--r-sm)">
          <span class="tiny muted">Saldo nominal (a − b), recalculado sozinho</span>
          <strong id="eNominalPrev" class="mono">—</strong>
        </div>
        <div class="sep"></div>
        <h3>Contato e recebimento</h3>
        ${blocoDadosRecebimento(c)}
        <div class="sep"></div>
        <h3>Acesso ao site</h3>
        <div class="tiny muted" style="margin:6px 0 10px">

      if (!confirm('Desvincular o acesso de ' + c.nome + '?\n\nO login ' + c.emailAcesso + ' deixa de ver esta conta, e ela volta a poder ser reivindicada por quem informar o CPF e os 4 dígitos.\n\nO aceite do termo também é apagado: quem assumir depois aceita de novo.')) return;
      await Backend.admDesvincular(c.id);
      fecharModal(); await recarregar(); irPara(S.aba);
    };
    if (porId('eLimpar')) porId('eLimpar').onclick = async () => {
      await Backend.atualizarConta(c.id, { pendencias: [], pendenciasAbertas: 0, severidadeMax: null });
      fecharModal(); await recarregar(); irPara(S.aba);
    };
    porId('mOk').onclick = async () => {
      const ap = moedaValor(porId('eAp').value);
      const sq = moedaValor(porId('eSq').value);
      const sd = moedaValor(porId('eSd').value);
      const doc = soDigitos(porId('eCpf').value);
      const tel = soDigitos(porId('eTel').value);
      const email = porId('eEmail').value.trim().toLowerCase();
      const erros = [];
      if (doc && !validaDoc(doc)) erros.push('CPF/CNPJ inválido.');
      if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) erros.push('E-mail inválido.');
      if (tel && tel.length < 10) erros.push('Telefone incompleto.');
      if (erros.length) { alert(erros.join('\n')); return; }
      const txt = String(porId('eTaxa').value).replace(',', '.').trim();
      await Backend.atualizarConta(c.id, {
        nome: porId('eNome').value.trim(), emailCadastro: email, cpf: doc, telefone: tel,
        ult4: tel.slice(-4), aportes: ap, saques: sq, saldoNominal: Math.round((ap - sq) * 100) / 100,
        saldoDevedor: sd, prioridade: Number(porId('ePrio').value || 0),
        taxaMensal: txt === '' ? null : Number(txt) / 100,
        maxParcelas: porId('eMaxP').value ? Number(porId('eMaxP').value) : null,
        ativo: porId('eAtivo').checked
      });
      fecharModal(); await recarregar(); irPara(S.aba);
    };
  }


  /* ================================================================
     CALIBRAGEM — simular o efeito dos pesos na base inteira
     ================================================================ */
  function alvosCalibragem() {
    const r = S.cal.recorte;
    let l = S.contas.filter(c => c.ativo && !c.pago);
    if (r === 'nao_negociou') l = l.filter(c => !propsDaConta(c.id).length);
    else if (r.startsWith('prio')) l = l.filter(c => Number(c.prioridade || 0) === Number(r.slice(4)));
    else if (r.startsWith('grupo:')) l = l.filter(c => c.grupo === r.slice(6));
    return l;
  }

  function abaCalibragem() {
    if (S.cal.indice === null) S.cal.indice = Number(S.cfg.taxaPadrao || 0) * 100;
    const alvos = alvosCalibragem();
    const n = Math.max(1, Number(S.cal.parcelas) || 1);
    const iSim = Number(String(S.cal.indice).replace(',', '.') || 0) / 100;

    const saldo = alvos.reduce((s, c) => s + Number(c.saldoDevedor || 0), 0);
    const hoje = alvos.reduce((s, c) => s + simularParcelamento(c.saldoDevedor, taxaDa(c), n).valorTotal, 0);
    const sim = alvos.reduce((s, c) => s + simularParcelamento(c.saldoDevedor, iSim, n).valorTotal, 0);
    const parcelasSim = alvos.map(c => simularParcelamento(c.saldoDevedor, iSim, n).valorParcela);
    const media = parcelasSim.length ? parcelasSim.reduce((a, b) => a + b, 0) / parcelasSim.length : 0;
    const maior = parcelasSim.length ? Math.max(...parcelasSim) : 0;

    /* quebra por prioridade — é como ele calibra ao longo do tempo */
    const porPrio = (S.cfg.prioridades || []).map((pr, i) => ({ ...pr, i, n: 0, saldo: 0, sim: 0 }));
    alvos.forEach(c => {
      const i = Math.min(Number(c.prioridade || 0), porPrio.length - 1);
      const g = porPrio[i];
      if (!g) return;
      g.n++;
      g.saldo += Number(c.saldoDevedor || 0);
      g.sim += simularParcelamento(c.saldoDevedor, iSim, n).valorTotal;
    });

    const dif = sim - saldo;
    const difHoje = sim - hoje;

    render(`
    <div class="stack">
      <div class="card card-pad">
        <h2>Calibragem dos cálculos</h2>
        <p class="muted tiny" style="margin-top:4px">Dois pesos definem tudo que o credor vê na simulação: o
        <strong>índice ao mês</strong> e o <strong>número de parcelas</strong>. Mexa neles aqui e veja o efeito
        na base inteira antes de decidir. Nada muda para os credores enquanto você não aplicar.</p>

        <div class="grid2" style="margin-top:16px">
          <div class="field">
            <label for="calInd">Índice ao mês (%)</label>
            <input id="calInd" inputmode="decimal" value="${escHtml(String(S.cal.indice).replace('.', ','))}">
            <div class="help">Nunca aparece na tela do credor. Ele vê só o valor da parcela e o percentual.</div>
          </div>
          <div class="field">
            <label for="calParc">Número de parcelas simulado</label>
            <input id="calParc" type="number" min="1" max="120" value="${n}">
            <div class="help">É o cenário que você quer medir, não o máximo permitido.</div>
          </div>
        </div>
        <div class="field">
          <label for="calRec">Sobre quais credores</label>
          <select id="calRec">
            <option value="todos" ${S.cal.recorte === 'todos' ? 'selected' : ''}>Todos os credores liberados e não pagos</option>
            <option value="nao_negociou" ${S.cal.recorte === 'nao_negociou' ? 'selected' : ''}>Só os que ainda não negociaram</option>
            ${(S.cfg.prioridades || []).map((pr, i) => `<option value="prio${i}" ${S.cal.recorte === 'prio' + i ? 'selected' : ''}>Prioridade: ${escHtml(pr.nome)}</option>`).join('')}
            ${[...new Set(S.contas.map(c => c.grupo).filter(Boolean))].sort().map(g => `<option value="grupo:${escHtml(g)}" ${S.cal.recorte === 'grupo:' + g ? 'selected' : ''}>${escHtml(g)}</option>`).join('')}
          </select>
        </div>
        <div class="row" style="margin-top:12px">
          ${[0.5, 1, 1.25, 1.5, 2, 3].map(v => `<button class="chip" data-ind="${v}" aria-pressed="${Number(S.cal.indice) === v}">${String(v).replace('.', ',')}%</button>`).join('')}
        </div>
        <div class="row" style="margin-top:8px">
          ${[1, 6, 12, 24, 36, 48].map(v => `<button class="chip" data-parc="${v}" aria-pressed="${n === v}">${v}x</button>`).join('')}
        </div>
      </div>

      <div class="tiles">
        <div class="tile"><div class="t-rot">Credores no recorte</div>
          <div class="t-val">${alvos.length}</div>
          <div class="t-sub">de ${S.contas.filter(c => c.ativo && !c.pago).length} liberados</div></div>
        <div class="tile"><div class="t-rot">Saldo devedor somado</div>
          <div class="t-val" style="font-size:1.25rem">${fmtBRL(saldo)}</div>
          <div class="t-sub">é o ponto de partida</div></div>
        <div class="tile"><div class="t-rot">Total a receber em ${n}x</div>
          <div class="t-val" style="font-size:1.25rem">${fmtBRL(sim)}</div>
          <div class="t-sub">${fmtPct(saldo ? sim / saldo : 0, 1)} do saldo</div></div>
        <div class="tile"><div class="t-rot">Acréscimo sobre o saldo</div>
          <div class="t-val" style="font-size:1.25rem;color:${dif >= 0 ? 'var(--st-sem)' : 'var(--st-ace)'}">${fmtBRL(dif)}</div>
          <div class="t-sub">é o que o prazo custa a mais</div></div>
        <div class="tile"><div class="t-rot">Parcela média</div>
          <div class="t-val" style="font-size:1.25rem">${fmtBRL(media)}</div>
          <div class="t-sub">maior: ${fmtBRL(maior)}</div></div>
        <div class="tile"><div class="t-rot">Contra os índices de hoje</div>
          <div class="t-val" style="font-size:1.25rem;color:${difHoje >= 0 ? 'var(--st-sem)' : 'var(--st-ace)'}">${difHoje >= 0 ? '+' : ''}${fmtBRL(difHoje)}</div>
          <div class="t-sub">hoje daria ${fmtBRL(hoje)}</div></div>
      </div>

      <div class="grid2">
        <div class="card card-pad">
          <h2>Por prioridade</h2>
          <p class="muted tiny" style="margin-top:4px">Conforme você for classificando os credores em Credores → Editar,
          esta tabela vai se preenchendo e você calibra cada grupo separado.</p>
          <div class="tbl-wrap" style="margin-top:12px;border:0"><table>
            <thead><tr><th>Prioridade</th><th class="num">Credores</th><th class="num">Saldo</th>
              <th class="num">Total em ${n}x</th><th class="num">%</th></tr></thead>
            <tbody>${porPrio.map(g => `<tr${g.n ? '' : ' style="opacity:.45"'}>
              <td><span class="prio" style="color:${g.cor}"><i style="background:${g.cor}"></i>${escHtml(g.nome)}</span></td>
              <td class="num">${g.n}</td>
              <td class="num">${g.n ? fmtBRL(g.saldo) : '—'}</td>
              <td class="num">${g.n ? fmtBRL(g.sim) : '—'}</td>
              <td class="num">${g.n ? fmtPct(g.saldo ? g.sim / g.saldo : 0, 1) : '—'}</td></tr>`).join('')}</tbody>
          </table></div>
        </div>
        <div class="card card-pad">
          <h2>Como fica para os maiores</h2>
          <div class="tbl-wrap" style="margin-top:12px;border:0"><table>
            <thead><tr><th>Credor</th><th class="num">Saldo</th><th class="num">Parcela em ${n}x</th></tr></thead>
            <tbody>${alvos.sort((a, b) => b.saldoDevedor - a.saldoDevedor).slice(0, 8).map(c => `<tr>
              <td>${escHtml(c.nome)}${c.contaLabel ? ` <span class="tiny muted">${escHtml(c.contaLabel)}</span>` : ''}</td>
              <td class="num">${fmtBRL(c.saldoDevedor)}</td>
              <td class="num">${fmtBRL(simularParcelamento(c.saldoDevedor, iSim, n).valorParcela)}</td></tr>`).join('')}</tbody>
          </table></div>
        </div>
      </div>

      <div class="card card-pad">
        <h2>Aplicar</h2>
        <p class="muted tiny" style="margin-top:4px">A simulação acima não muda nada sozinha. Escolha o que gravar.</p>
        <div class="row" style="margin-top:14px">
          <button class="btn-primary btn-sm" id="calGeral">Usar ${String(S.cal.indice).replace('.', ',')}% como índice geral</button>
          <button class="btn-sm" id="calLote">Gravar ${String(S.cal.indice).replace('.', ',')}% nos ${alvos.length} credores do recorte</button>
          <button class="btn-sm" id="calMax">Usar ${n}x como máximo de parcelas</button>
        </div>
        <div class="help" style="margin-top:10px">O índice geral vale para quem não tem índice próprio.
        Gravar no recorte sobrescreve o índice individual de cada um deles.</div>
      </div>
    </div>`);

    const redesenha = () => abaCalibragem();
    porId('calInd').onchange = e => { S.cal.indice = e.target.value; redesenha(); };
    porId('calParc').onchange = e => { S.cal.parcelas = e.target.value; redesenha(); };
    porId('calRec').onchange = e => { S.cal.recorte = e.target.value; redesenha(); };
    ligar('[data-ind]', 'click', e => { S.cal.indice = Number(e.currentTarget.dataset.ind); redesenha(); });
    ligar('[data-parc]', 'click', e => { S.cal.parcelas = Number(e.currentTarget.dataset.parc); redesenha(); });

    porId('calGeral').onclick = async () => {
      if (!confirm('Passar o índice geral para ' + S.cal.indice + '% ao mês?\n\nVale para todo credor que não tenha índice próprio.')) return;
      await Backend.salvarConfig({ taxaPadrao: iSim });
      await recarregar(); irPara('calibragem');
    };
    porId('calMax').onclick = async () => {
      if (!confirm('Passar o máximo de parcelas para ' + n + 'x?\n\nÉ o teto que o credor vê no simulador.')) return;
      await Backend.salvarConfig({ maxParcelas: n });
      await recarregar(); irPara('calibragem');
    };
    porId('calLote').onclick = async () => {
      if (!alvos.length) return;
      if (!confirm('Gravar ' + S.cal.indice + '% ao mês em ' + alvos.length + ' credores?\n\nIsso sobrescreve o índice individual de cada um.')) return;
      if (!confirm('Confirmação final: ' + alvos.length + ' credores vão passar a calcular a parcela com ' + S.cal.indice + '% ao mês.')) return;
      const b = porId('calLote'); b.disabled = true; b.textContent = 'Gravando…';
      for (const c of alvos) await Backend.atualizarConta(c.id, { taxaMensal: iSim });
      await recarregar(); irPara('calibragem');
    };
  }

  /* ================================================================
     RELATÓRIO DE ERROS
     ================================================================ */
  const ORDEM_SEV = { critica: 0, alta: 1, media: 2, baixa: 3 };
  const ROT_SEV = { critica: 'Crítica — resolver antes de publicar', alta: 'Alta — trava o acesso da pessoa',
    media: 'Média — pode entrar, mas confirme', baixa: 'Baixa — só informativo' };

  function abaPendencias() {
    const itens = [];
    S.contas.forEach(c => (c.pendencias || []).forEach(p => itens.push({ c, p })));
    itens.sort((a, b) => (ORDEM_SEV[a.p.severidade] - ORDEM_SEV[b.p.severidade]) || b.c.saldoDevedor - a.c.saldoDevedor);
    const porSev = {};
    itens.forEach(i => (porSev[i.p.severidade] = porSev[i.p.severidade] || []).push(i));

    render(`
    <div class="stack">
      <div class="card card-pad">
        <h2>Relatório de erros de cadastro</h2>
        <p class="muted tiny" style="margin-top:4px">Cada item aqui é um dado que veio incompleto ou inconsistente das planilhas.
        Corrija no próprio credor e marque como resolvido. Contas com erro de acesso ficam bloqueadas até você resolver.</p>
        <div class="tiles" style="margin-top:14px">
          ${Object.keys(ORDEM_SEV).map(s => `<div class="tile">
            <div class="t-rot">${escHtml(ROT_SEV[s])}</div>
            <div class="t-val">${(porSev[s] || []).length}</div></div>`).join('')}
        </div>
        ${itens.length ? '' : `<div style="margin-top:14px">${aviso('Nenhuma pendência em aberto.', 'ok')}</div>`}
      </div>
      ${Object.keys(ORDEM_SEV).filter(s => (porSev[s] || []).length).map(s => `
        <div class="card card-pad">
          <h2>${escHtml(ROT_SEV[s])} <span class="tag ${s === 'critica' ? 'tag-bad' : s === 'alta' ? 'tag-warn' : 'tag-neutral'}">${porSev[s].length}</span></h2>
          <div style="margin-top:12px">
          ${porSev[s].map(({ c, p }) => `<div class="pend-item ${s}">
            <div class="row-between">
              <div class="grow">
                <strong>${escHtml(c.nome)}</strong>
                ${c.contaLabel ? `<span class="tiny muted"> ${escHtml(c.contaLabel)}</span>` : ''}

              </div>
              <button class="btn-sm" data-edit2="${c.id}">Corrigir</button>
            </div>
          </div>`).join('')}
          </div>
        </div>`).join('')}
    </div>`);
    ligar('[data-edit2]', 'click', e => modalEditarConta(e.currentTarget.dataset.edit2));
  }
